    function wrapPdfText(font,text,size,maxWidth,maxLines=2){
      const words=String(text||"").split(/\s+/).filter(Boolean);
      const lines=[];
      let current="";

      for(const word of words){
        const next=current?current+" "+word:word;

        if(font.widthOfTextAtSize(next,size)<=maxWidth){
          current=next;
          continue;
        }

        if(current)lines.push(current);
        current=word;

        if(lines.length>=maxLines-1)break;
      }

      if(current&&lines.length<maxLines)lines.push(current);
      return lines;
    }

    function drawExportCheck(page,x,y,pass){
      const green=rgb(0.20,0.62,0.34);
      const yellow=rgb(0.86,0.64,0.12);
      const paleGreen=rgb(0.88,0.97,0.90);
      const paleYellow=rgb(1.00,0.96,0.78);
      const color=pass?green:yellow;

      page.drawCircle({
        x,
        y,
        size:7,
        color:pass?paleGreen:paleYellow,
        borderColor:color,
        borderWidth:1
      });

      if(pass){
        page.drawLine({
          start:{x:x-3.1,y:y},
          end:{x:x-0.7,y:y-2.8},
          thickness:1.5,
          color
        });
        page.drawLine({
          start:{x:x-0.7,y:y-2.8},
          end:{x:x+3.8,y:y+3.1},
          thickness:1.5,
          color
        });
      }else{
        page.drawLine({
          start:{x,y:y+3.2},
          end:{x,y:y-1.5},
          thickness:1.5,
          color
        });
        page.drawCircle({
          x,
          y:y-4,
          size:0.9,
          color
        });
      }
    }

    async function drawEventARExport(pdfDoc,group,font,bold,outputStartIndex){
      if(!group.pdf?.numPages)return;

      const parsed=group.parsed||{};
      const comparison=parsed.arComparison||null;
      const firstPage=pdfDoc.getPage(outputStartIndex);
      const firstItems=await getPdfPageTextItems(group.pdf,1);

      const booking=
        firstItems.find(item=>/^BOOKING TYPE\s*:/i.test(item.text)) ||
        firstItems.find(item=>/BOOKING TYPE/i.test(item.text));

      const pageWidth=firstPage.getWidth();

      // Use the actual BEO content/table width, not the whole PDF page.
      // The first section heading below Booking Type shares the same left edge
      // as the content box, so it gives us a reliable horizontal boundary.
      const sectionBelow=firstItems
        .filter(item=>
          booking &&
          item.y<booking.y-4 &&
          /^(?:Asset|Beverages?|Food|Gameplay|Game Enhancement|Retail|Labor|Limited Inventory|Equipment Rental|Event Space Rental|Space Rental|Digital Media|Incentives?)$/i.test(item.text)
        )
        .sort((a,b)=>b.y-a.y)[0]||null;

      const detectedLeft=Math.min(
        booking?.x??48,
        sectionBelow?.x??(booking?.x??48)
      );
      const contentLeft=Math.max(36,detectedLeft-4);
      const contentRight=pageWidth-contentLeft;
      const contentWidth=contentRight-contentLeft;
      const centerX=(contentLeft+contentRight)/2;
      const y=booking?booking.y-22:firstPage.getHeight()-220;

      if(!parsed.arProcessed||!comparison){
        const notDone="AR NOT COMPLETED";
        const size=10.4;
        const width=bold.widthOfTextAtSize(notDone,size);

        firstPage.drawText(notDone,{
          x:centerX-(width/2),
          y,
          size,
          font:bold,
          color:rgb(0.45,0.45,0.48)
        });
      }else{
        const pieces=comparison.items.map(item=>
          exportCategoryLabel(item.label)+" "+formatSignedMoney(item.additional)
        );

        let totalY=y;

        // Only show the category line when there are actual AR categories.
        if(pieces.length){
          const categorySize=10.2;
          const separator="     |     ";
          const separatorWidth=bold.widthOfTextAtSize(separator,categorySize);
          const pieceWidths=pieces.map(piece=>bold.widthOfTextAtSize(piece,categorySize));
          const oneLineWidth=
            pieceWidths.reduce((sum,width)=>sum+width,0)+
            separatorWidth*Math.max(0,pieces.length-1);

          if(oneLineWidth<=contentWidth){
            let drawX=centerX-(oneLineWidth/2);

            pieces.forEach((piece,index)=>{
              firstPage.drawText(piece,{
                x:drawX,
                y,
                size:categorySize,
                font:bold,
                color:rgb(0.10,0.10,0.12)
              });

              drawX+=pieceWidths[index];

              if(index<pieces.length-1){
                firstPage.drawText(separator,{
                  x:drawX,
                  y,
                  size:categorySize,
                  font:bold,
                  color:rgb(0.34,0.34,0.37)
                });
                drawX+=separatorWidth;
              }
            });

            totalY=y-16;
          }else{
            const categoryText=pieces.join("  |  ");
            const lines=wrapPdfText(bold,categoryText,categorySize,contentWidth,2);

            lines.forEach((line,index)=>{
              const lineWidth=bold.widthOfTextAtSize(line,categorySize);

              firstPage.drawText(line,{
                x:centerX-(lineWidth/2),
                y:y-(index*13),
                size:categorySize,
                font:bold,
                color:rgb(0.10,0.10,0.12)
              });
            });

            totalY=y-(lines.length*13)-3;
          }
        }

        const totalLabel="TOTAL AR: ";
        const green=rgb(0.10,0.44,0.22);
        const red=rgb(0.70,0.16,0.16);
        const totalAccent=comparison.total<0?red:green;
        const black=rgb(0.10,0.10,0.12);
        const totalSize=11.4;
        const totalLabelGap=4;

        if(comparison.flexAdjusted){
          const formulaText=
            formatMoney(comparison.grossTotal)+
            " - "+
            formatMoney(comparison.fbMinimum)+
            " =  ";
          const resultText=formatMoney(comparison.total);

          const labelWidth=bold.widthOfTextAtSize(totalLabel,totalSize);
          const formulaWidth=bold.widthOfTextAtSize(formulaText,totalSize);
          const resultWidth=bold.widthOfTextAtSize(resultText,totalSize);
          const totalWidth=labelWidth+totalLabelGap+formulaWidth+resultWidth;
          const startX=centerX-(totalWidth/2);

          // Keep the TOTAL AR label and final answer green, while the actual
          // subtraction stays black for quick visual separation.
          firstPage.drawText(totalLabel,{
            x:startX,
            y:totalY,
            size:totalSize,
            font:bold,
            color:totalAccent
          });

          firstPage.drawText(formulaText,{
            x:startX+labelWidth+totalLabelGap,
            y:totalY,
            size:totalSize,
            font:bold,
            color:black
          });

          firstPage.drawText(resultText,{
            x:startX+labelWidth+totalLabelGap+formulaWidth,
            y:totalY,
            size:totalSize,
            font:bold,
            color:totalAccent
          });
        }else{
          const resultText=formatMoney(comparison.total);
          const labelWidth=bold.widthOfTextAtSize(totalLabel,totalSize);
          const resultWidth=bold.widthOfTextAtSize(resultText,totalSize);
          const totalWidth=labelWidth+totalLabelGap+resultWidth;
          const startX=centerX-(totalWidth/2);

          firstPage.drawText(totalLabel,{
            x:startX,
            y:totalY,
            size:totalSize,
            font:bold,
            color:totalAccent
          });

          firstPage.drawText(resultText,{
            x:startX+labelWidth+totalLabelGap,
            y:totalY,
            size:totalSize,
            font:bold,
            color:totalAccent
          });
        }
      }

      if(!parsed.arProcessed||!comparison)return;

      let billingLocalIndex=null;
      let billingItems=[];

      for(let pageNumber=1;pageNumber<=group.pdf.numPages;pageNumber++){
        const items=await getPdfPageTextItems(group.pdf,pageNumber);
        const pageText=items.map(item=>item.text).join(" ");

        if(
          /\bBILLING SUMMARY\b/i.test(pageText) ||
          /Subtotal\s+Taxes\s+Service Charge\s+Admin Fee\s+Total Charges/i.test(pageText)
        ){
          billingLocalIndex=pageNumber-1;
          billingItems=items;
          break;
        }
      }

      if(billingLocalIndex===null)return;

      const billingPage=pdfDoc.getPage(outputStartIndex+billingLocalIndex);

      const subtotal=billingItems.find(item=>/^Subtotal$/i.test(item.text));
      if(!subtotal)return;

      const paymentSummary=billingItems.find(item=>/^PAYMENT SUMMARY$/i.test(item.text));
      const check=comparison.subtotalCheck;
      const pass=Boolean(check&&check.pass);

      // Keep the indicator inside the left Subtotal cell. The Subtotal label is
      // centered in that cell, so shifting left places the badge safely inside it.
      const badgeX=Math.max(12,subtotal.x-34);
      const badgeY=subtotal.y-14;

      drawExportCheck(billingPage,badgeX,badgeY,pass);

      if(check&&!check.pass){
        const direction=check.arDifference>0?"AR up ":"AR down ";
        const discrepancyText=direction+formatMoney(check.discrepancy);
        const discrepancyY=paymentSummary
          ? paymentSummary.y+5
          : subtotal.y-38;

        billingPage.drawText(discrepancyText,{
          x:subtotal.x,
          y:discrepancyY,
          size:6.2,
          font:bold,
          color:rgb(0.62,0.43,0.08)
        });
      }
    }

    async function exportAnnotatedPdf(){
      if(!currentGroups.length)return;

      const oldText=exportButton.textContent;
      exportButton.disabled=true;
      exportButton.textContent="Exporting…";

      try{
        const pdfDoc=await PDFDocument.create();
        const font=await pdfDoc.embedFont(StandardFonts.Helvetica);
        const bold=await pdfDoc.embedFont(StandardFonts.HelveticaBold);

        for(const group of currentGroups){
          if(!group.pdfBytes)continue;

          const eventDoc=await PDFDocument.load(group.pdfBytes.slice());
          const indices=eventDoc.getPageIndices();
          const outputStartIndex=pdfDoc.getPageCount();
          const copied=await pdfDoc.copyPages(eventDoc,indices);

          copied.forEach(page=>pdfDoc.addPage(page));

          // Printable mode: currentGroups are already split by BEO/event.
          // If this individual event is odd, add exactly one blank page
          // before the next event begins so duplex printing never crosses BEOs.
          if(copied.length%2===1&&copied.length){
            const lastPage=copied[copied.length-1];
            pdfDoc.addPage([lastPage.getWidth(),lastPage.getHeight()]);
          }

          await drawEventARExport(
            pdfDoc,
            group,
            font,
            bold,
            outputStartIndex
          );
        }

        const bytes=await pdfDoc.save();
        const blob=new Blob([bytes],{type:"application/pdf"});
        const url=URL.createObjectURL(blob);
        const a=document.createElement("a");
        a.href=url;
        a.download=getExportPdfName();
        document.body.appendChild(a);
        a.click();
        a.remove();

        setTimeout(()=>URL.revokeObjectURL(url),1500);
      }catch(error){
        console.error("AR export failed:",error);
        alert("Could not export the annotated PDF. Please try again.");
      }finally{
        exportButton.disabled=false;
        exportButton.textContent=oldText;
      }
    }

      ui.scanLog.classList.remove("visible");

    function updateSubtotalCheck(badge,comparison){
      if(!badge)return;

      const check=comparison.subtotalCheck;

      badge.className="subtotal-check";
      badge.textContent="";
      badge.removeAttribute("data-tooltip");

      if(!check){
        badge.classList.add("warn","visible");
        badge.textContent="!";
        badge.dataset.tooltip="Subtotal check discrepancy\n(unable to fully reconcile)";
        badge.setAttribute(
          "aria-label",
          "Subtotal check discrepancy. Unable to fully reconcile."
        );
        return;
      }

      if(check.pass){
        badge.classList.add("pass","visible");
        badge.textContent="✓";
        badge.dataset.tooltip="Subtotal check pass";
        badge.setAttribute("aria-label","Subtotal check pass");
      }else{
        badge.classList.add("warn","visible");
        badge.textContent="!";

        const discrepancy=check.discrepancy;
        const arDirection=check.arDifference>0?"up":"down";
        const detail="AR "+arDirection+" "+formatMoney(discrepancy);

        badge.dataset.tooltip="Subtotal check discrepancy\n("+detail+")";
        badge.setAttribute(
          "aria-label",
          "Subtotal check discrepancy. "+detail+"."
        );
      }
    }

    function makeFinanceItem(label,value,total,detail,originalValue=null,incentiveAmount=0){
      const item=document.createElement("div");
      item.className="finance-item";

      const l=document.createElement("div");
      l.className="finance-label";

        valueLine.className="finance-value-line";

        original.textContent=originalValue;

        const discounted=document.createElement("span");
        discounted.className="finance-discounted";
        discounted.textContent=value;

        valueLine.append(original,discounted);
        item.append(l,valueLine);

    async function renderThumbnail(pdf,canvas){
      const page=await pdf.getPage(1);
      const base=page.getViewport({scale:1});
      const scale=Math.min(300/base.width,175/base.height);
      const viewport=page.getViewport({scale});
      const output=Math.min(devicePixelRatio||1,2);
      const ctx=canvas.getContext("2d");
      canvas.width=Math.floor(viewport.width*output);
      canvas.height=Math.floor(viewport.height*output);
      canvas.style.width=Math.floor(viewport.width)+"px";
      canvas.style.height=Math.floor(viewport.height)+"px";
      await page.render({canvasContext:ctx,viewport,transform:output!==1?[output,0,0,output,0,0]:null}).promise;
    }

    async function buildEventPreviewPdf(group){
      if(
        !group?.pdfBytes ||
        !group?.parsed?.arProcessed ||
        !group?.parsed?.arComparison
      ){
        return group?.pdf||null;
      }

      const pdfDoc=await PDFDocument.load(group.pdfBytes.slice());
      const font=await pdfDoc.embedFont(StandardFonts.Helvetica);
      const bold=await pdfDoc.embedFont(StandardFonts.HelveticaBold);

      await drawEventARExport(pdfDoc,group,font,bold,0);

      const bytes=await pdfDoc.save();
      return pdfjsLib.getDocument({data:bytes.slice()}).promise;
    }

    async function refreshEventPdfPreview(group){
      if(!group?.pdf)return;

      try{
        group.previewPdf=await buildEventPreviewPdf(group);

        if(group?.ui?.previewCanvas&&group.previewPdf){
          await renderThumbnail(group.previewPdf,group.ui.previewCanvas);
        }
      }catch(error){
        console.warn("Could not refresh annotated BEO preview:",error);
        group.previewPdf=group.pdf;

        if(group?.ui?.previewCanvas){
          await renderThumbnail(group.pdf,group.ui.previewCanvas);
        }
      }
    }

    function previewCacheKey(pdf,pageNumber,widthLimit,heightLimit){
      const id=pdf?._armaticPreviewId||(pdf._armaticPreviewId="p"+Math.random().toString(36).slice(2));
      return [
        id,
        pageNumber,
        Math.round(widthLimit),
        Math.round(heightLimit),
        Math.min(devicePixelRatio||1,2)
      ].join(":");
    }

    async function getCachedPreviewBitmap(pdf,pageNumber,widthLimit,heightLimit){
      const key=previewCacheKey(pdf,pageNumber,widthLimit,heightLimit);
      const cached=previewPageCache.get(key);
      if(cached)return cached;

      const page=await pdf.getPage(pageNumber);
      const base=page.getViewport({scale:1});
      const scale=Math.min(widthLimit/base.width,heightLimit/base.height,1.7);
      const viewport=page.getViewport({scale});
      const output=Math.min(devicePixelRatio||1,2);
      const offscreen=document.createElement("canvas");
      const ctx=offscreen.getContext("2d");

      offscreen.width=Math.floor(viewport.width*output);
      offscreen.height=Math.floor(viewport.height*output);

      await page.render({
        canvasContext:ctx,
        viewport,
        transform:output!==1?[output,0,0,output,0,0]:null
      }).promise;

      const entry={
        canvas:offscreen,
        cssWidth:Math.floor(viewport.width),
        cssHeight:Math.floor(viewport.height)
      };

      previewPageCache.set(key,entry);
      return entry;
    }

    async function preloadEventPreview(group){
      if(!group?.previewPdf&&!group?.pdf)return;
      const pdf=group.previewPdf||group.pdf;
      const recapPages=Array.isArray(group.recapPageNumbers)&&group.recapPageNumbers.length
        ?group.recapPageNumbers
        :(group.recapPageNumber?[group.recapPageNumber]:[]);
      const sideBySide=Boolean(group.recapPdf&&recapPages.length&&innerWidth>900);
      const widthLimit=sideBySide?innerWidth*.47:innerWidth*.90;
      const heightLimit=innerHeight*.84;

      const jobs=[getCachedPreviewBitmap(pdf,1,widthLimit,heightLimit)];

      if(group.recapPdf&&recapPages.length){
        for(const recapPage of recapPages.slice(0,2)){
          jobs.push(getCachedPreviewBitmap(
            group.recapPdf,
            recapPage,
            innerWidth>900?innerWidth*.47:innerWidth*.90,
            innerHeight*.84
          ));
        }
      }

      await Promise.allSettled(jobs);
    }

    async function openPreview(
      pdf,
      name,
      opportunityId=null,
      recapPdf=null,
      recapPages=null,
      group=null
    ){
      activePreviewPdf=pdf;
      activePreviewPage=1;
      activePreviewRecapPdf=recapPdf;
      activePreviewRecapPages=Array.isArray(recapPages)
        ?recapPages.filter(Number.isInteger)
        :(Number.isInteger(recapPages)?[recapPages]:[]);
      activePreviewRecapPageIndex=0;
      activePreviewRecapPage=activePreviewRecapPages[0]||null;
      activePreviewGroupIndex=group?currentGroups.indexOf(group):-1;

      if(group?.parsed){
        const previewKey=eventEnteredKey(group.parsed.eventCard,group.parsed.date);
        previewEnteredCheck.dataset.enteredKey=previewKey||"";
        syncEnteredButton(
          previewEnteredCheck,
          getEventEntered(group.parsed.eventCard,group.parsed.date)
        );
      }else{
        previewEnteredCheck.dataset.enteredKey="";
        syncEnteredButton(previewEnteredCheck,false);
      }
      updateEnteredProgress();

      modalEventName.replaceChildren();

      const opportunityHref=opportunityUrl(opportunityId);

      if(opportunityHref){
        const link=document.createElement("a");
        link.className="modal-event-link";
        link.href=opportunityHref;
        link.target="_blank";
        link.rel="noopener noreferrer";
        link.textContent=name||"Event BEO";
        link.title="Open this event in Salesforce";
        modalEventName.appendChild(link);
      }else{
        modalEventName.textContent=name||"Event BEO";
      }

      const eventCard=String(group?.parsed?.eventCard||"").trim();
      const toastHref=toastEventReportUrl(eventCard,group?.parsed?.date);

      if(eventCard&&toastHref){
        modalEventToastLink.textContent="Event "+eventCard;
        modalEventToastLink.href=toastHref;
        modalEventToastLink.hidden=false;
      }else{
        modalEventToastLink.hidden=true;
        modalEventToastLink.removeAttribute("href");
      }

      prevEvent.disabled=activePreviewGroupIndex<=0;
      nextEvent.disabled=
        activePreviewGroupIndex<0 ||
        activePreviewGroupIndex>=currentGroups.length-1;

      const hasRecap=Boolean(
        activePreviewRecapPdf &&
        activePreviewRecapPages.length &&
        activePreviewRecapPage &&
        activePreviewRecapPage<=activePreviewRecapPdf.numPages
      );

      pdfModal.classList.toggle("has-recap",hasRecap);
      previewShell?.classList.toggle("no-recap",!hasRecap);
      recapPane.style.display=hasRecap?"flex":"none";
      pdfModal.classList.add("open");
      pdfModal.setAttribute("aria-hidden","false");
      document.body.style.overflow="hidden";

      await Promise.all([
        renderModalPage(),
        hasRecap?renderRecapPreview():Promise.resolve()
      ]);

      const adjacent=[
        currentGroups[activePreviewGroupIndex-1],
        currentGroups[activePreviewGroupIndex+1]
      ].filter(Boolean);

      adjacent.forEach(item=>preloadEventPreview(item).catch(()=>{}));
    }

    async function renderModalPage(){
      if(!activePreviewPdf)return;

      const sideBySide=
        pdfModal.classList.contains("has-recap")&&
        innerWidth>900;

      prevPage.disabled=activePreviewPage<=1;
      nextPage.disabled=activePreviewPage>=activePreviewPdf.numPages;
      pageCounter.textContent=activePreviewPage+" of "+activePreviewPdf.numPages;

      if(modalRenderTask){
        try{modalRenderTask.cancel()}catch(_){}
        modalRenderTask=null;
      }

      try{
        const widthLimit=sideBySide?innerWidth*.47:innerWidth*.90;
        const heightLimit=innerHeight*.84;
        const cached=await getCachedPreviewBitmap(
          activePreviewPdf,
          activePreviewPage,
          widthLimit,
          heightLimit
        );
        const ctx=modalCanvas.getContext("2d");

        modalCanvas.width=cached.canvas.width;
        modalCanvas.height=cached.canvas.height;
        modalCanvas.style.width=cached.cssWidth+"px";
        modalCanvas.style.height=cached.cssHeight+"px";
        ctx.clearRect(0,0,modalCanvas.width,modalCanvas.height);
        ctx.drawImage(cached.canvas,0,0);

        modalLoading.style.display="none";
        modalCanvas.style.display="block";

        // Warm the neighboring BEO page while this one is visible.
        const neighbor=
          activePreviewPage<activePreviewPdf.numPages
            ? activePreviewPage+1
            : activePreviewPage>1
              ? activePreviewPage-1
              : null;
        if(neighbor){
          getCachedPreviewBitmap(
            activePreviewPdf,
            neighbor,
            widthLimit,
            heightLimit
          ).catch(()=>{});
        }
      }catch(err){
        console.error(err);
        modalLoading.style.display="block";
        modalCanvas.style.display="none";
      }
    }

    async function renderRecapPreview(){
      activePreviewRecapPage=activePreviewRecapPages[activePreviewRecapPageIndex]||null;
      prevRecapPage.disabled=activePreviewRecapPageIndex<=0;
      nextRecapPage.disabled=activePreviewRecapPageIndex>=activePreviewRecapPages.length-1;
      recapPageCounter.textContent=activePreviewRecapPages.length
        ?(activePreviewRecapPageIndex+1)+" of "+activePreviewRecapPages.length
        :"0 of 0";
      const recapControls=recapPageCounter.closest(".recap-controls");
      if(recapControls){
        recapControls.style.display=activePreviewRecapPages.length>1?"flex":"none";
      }

      if(
        !activePreviewRecapPdf ||
        !activePreviewRecapPage ||
        activePreviewRecapPage>activePreviewRecapPdf.numPages
      ){
        recapCanvas.style.display="none";
        recapLoading.style.display="none";
        return;
      }

      if(recapRenderTask){
        try{recapRenderTask.cancel()}catch(_){}
        recapRenderTask=null;
      }

      try{
        const widthLimit=innerWidth>900?innerWidth*.47:innerWidth*.90;
        const heightLimit=innerHeight*.84;
        const cached=await getCachedPreviewBitmap(
          activePreviewRecapPdf,
          activePreviewRecapPage,
          widthLimit,
          heightLimit
        );
        const ctx=recapCanvas.getContext("2d");

        recapCanvas.width=cached.canvas.width;
        recapCanvas.height=cached.canvas.height;
        recapCanvas.style.width=cached.cssWidth+"px";
        recapCanvas.style.height=cached.cssHeight+"px";
        ctx.clearRect(0,0,recapCanvas.width,recapCanvas.height);
        ctx.drawImage(cached.canvas,0,0);

        recapLoading.style.display="none";
        recapCanvas.style.display="block";
      }catch(err){
        console.error(err);
        recapLoading.style.display="block";
        recapCanvas.style.display="none";
      }
    }

    function closePreview(){
      pdfModal.classList.remove("open");
      pdfModal.setAttribute("aria-hidden","true");
      document.body.style.overflow="";
      activePreviewPdf=null;
      activePreviewPage=1;
      activePreviewRecapPdf=null;
      activePreviewRecapPage=null;
      activePreviewRecapPages=[];
      activePreviewRecapPageIndex=0;
      activePreviewGroupIndex=-1;
      modalEventToastLink.hidden=true;
      modalEventToastLink.removeAttribute("href");
      pdfModal.classList.remove("has-recap");
      previewShell?.classList.remove("no-recap");
      recapPane.style.display="none";
      if(modalRenderTask){try{modalRenderTask.cancel()}catch(_){}modalRenderTask=null}
      if(recapRenderTask){try{recapRenderTask.cancel()}catch(_){}recapRenderTask=null}
    }

    previewEnteredCheck.addEventListener("click",(event)=>{
      event.preventDefault();
      event.stopPropagation();

      const group=currentGroups[activePreviewGroupIndex];
      if(!group?.parsed)return;

      const entered=!getEventEntered(
        group.parsed.eventCard,
        group.parsed.date
      );

      setEventEntered(
        group.parsed.eventCard,
        group.parsed.date,
        entered
      );
      updateEnteredProgress();
    });

        prevPage.addEventListener("click",()=>{if(activePreviewPdf&&activePreviewPage>1){activePreviewPage--;renderModalPage()}});
    nextPage.addEventListener("click",()=>{if(activePreviewPdf&&activePreviewPage<activePreviewPdf.numPages){activePreviewPage++;renderModalPage()}});

    async function openAdjacentEvent(direction){
      if(activePreviewGroupIndex<0)return;
      const targetIndex=activePreviewGroupIndex+direction;
      if(targetIndex<0||targetIndex>=currentGroups.length)return;

      const group=currentGroups[targetIndex];
      await openPreview(
        group.previewPdf||group.pdf,
        group.parsed?.fullTitle||group.parsed?.name||"Event BEO",
        group.parsed?.opportunityId||null,
        group.recapPdf||null,
        group.recapPageNumbers?.length?group.recapPageNumbers:(group.recapPageNumber||null),
        group
      );
    }

    prevRecapPage.addEventListener("click",()=>{
      if(activePreviewRecapPageIndex<=0)return;
      activePreviewRecapPageIndex--;
      renderRecapPreview();
    });
    nextRecapPage.addEventListener("click",()=>{
      if(activePreviewRecapPageIndex>=activePreviewRecapPages.length-1)return;
      activePreviewRecapPageIndex++;
      renderRecapPreview();
    });

    prevEvent.addEventListener("click",()=>openAdjacentEvent(-1));
    nextEvent.addEventListener("click",()=>openAdjacentEvent(1));
    modalClose.addEventListener("click",closePreview);
    pdfModal.addEventListener("click",e=>{if(e.target===pdfModal)closePreview()});
    document.addEventListener("keydown",e=>{
      if(!pdfModal.classList.contains("open"))return;
      if(e.key==="Escape")closePreview();
      if(e.shiftKey&&e.key==="ArrowLeft"){openAdjacentEvent(-1);return}
      if(e.shiftKey&&e.key==="ArrowRight"){openAdjacentEvent(1);return}
      if(e.key==="ArrowLeft"&&activePreviewPage>1){activePreviewPage--;renderModalPage()}
      if(e.key==="ArrowRight"&&activePreviewPdf&&activePreviewPage<activePreviewPdf.numPages){activePreviewPage++;renderModalPage()}
    });

    async function extractLines(page){
      const content=await page.getTextContent();
      const items=content.items.filter(i=>i.str&&i.str.trim()).map(i=>({text:i.str.trim(),x:(i.transform&&i.transform[4])||0,y:(i.transform&&i.transform[5])||0,width:i.width||0}));
      const rows=[];
      for(const item of items){
        let row=rows.find(r=>Math.abs(r.y-item.y)<=2.25);
        if(!row){row={y:item.y,items:[]};rows.push(row)}
        row.items.push(item);
      }
      rows.sort((a,b)=>b.y-a.y);
      return rows.map(row=>{
        row.items.sort((a,b)=>a.x-b.x);
        let line="",right=null;
        for(const item of row.items){
          if(right!==null)line+=item.x-right>8?"  ":" ";
          line+=item.text;
          right=item.x+item.width;
        }
        return clean(line);
      }).filter(Boolean);
    }

    async function terminalMessage(message,tone=""){
      const line=document.createElement("div");
      line.className="terminal-line"+(tone?" "+tone:"");
      const prompt=document.createElement("span");
      prompt.className="prompt";
      prompt.textContent=tone==="success"?"✓":">";
      const content=document.createElement("span");
      line.append(prompt,content);
      terminal.appendChild(line);

      if(reduced){
        content.textContent=message;
        return;
      }

      const cursor=document.createElement("span");
      cursor.className="cursor";
      content.appendChild(cursor);

      for(let i=0;i<message.length;i++){
        cursor.insertAdjacentText("beforebegin",message[i]);
        terminal.scrollTop=terminal.scrollHeight;
        await delay(2+Math.random()*3);
      }

      cursor.remove();
      await delay(12);
    }

    function parseMoney(value){
      const n=Number(String(value||"").replace(/USD|\$|,/gi,"").trim());
      return Number.isFinite(n)?n:null;
    }
    function moneyCents(value){
      const n=Number(value);
      return Number.isFinite(n)?Math.round((n+Number.EPSILON)*100):0;
    }
    function centsMoney(cents){
      return moneyCents(Number(cents)/100)/100;
    }
    function formatSignedMoney(value){
      if(value===null||!Number.isFinite(value))return"—";
      if(Math.abs(value)<0.005)return formatMoney(0);
      return value>0?"+"+formatMoney(value):formatMoney(value);
    }
        function formatMoney(value){
      if(value===null||!Number.isFinite(value))return"—";
      return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(value);
    }
    function clean(v){return String(v||"").replace(/\s+/g," ").replace(/^[-–—|]+|[-–—|]+$/g,"").trim()}
    function esc(v){return String(v).replace(/[-\/\\^$*+?.()|[\]{}]/g,"\\$&")}
    function formatBytes(b){if(!Number.isFinite(b)||b<=0)return"PDF";if(b<1024)return b+" B";if(b<1048576)return(b/1024).toFixed(1)+" KB";return(b/1048576).toFixed(1)+" MB"}
    function delay(ms){return new Promise(r=>setTimeout(r,ms))}
