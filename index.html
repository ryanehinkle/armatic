<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARmatic</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    :root{color-scheme:dark;--bg:#080809;--panel:#18181b;--panel2:#1d1d21;--border:#34343b;--soft:#29292f;--text:#f5f5f7;--muted:#9696a0;--blue:#5185bd;--green:#65b47e}
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 50% 24%,#17171a 0%,#0d0d0f 40%,#080809 74%);color:var(--text)}
    button,input{font:inherit}button{color:inherit}#pdfInput,#toastCsvInput,#recapPdfInput{display:none}
    .landing{position:relative;min-height:100vh;display:grid;place-items:center;overflow:hidden;padding:24px}
    .floating-topgolf-logo{position:fixed;top:0;left:0;z-index:1;width:clamp(82px,7vw,112px);height:auto;max-height:58px;object-fit:contain;pointer-events:none;user-select:none;will-change:transform;filter:url(#topgolfLogoColor) drop-shadow(0 8px 18px rgba(0,0,0,.32))}
    .landing-card{position:relative;z-index:2;width:min(92vw,520px);padding:52px 42px 42px;text-align:center;background:var(--panel);border:1px solid #3a3a40;border-radius:14px;box-shadow:0 28px 80px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.03)}
    .brand-mark{width:58px;height:58px;display:grid;place-items:center;margin:0 auto 16px;border:1px solid #486f9a;border-radius:14px;background:linear-gradient(145deg,#21364d,#142333);color:#9fc4ec;font:800 1.45rem Georgia,"Times New Roman",serif;box-shadow:0 10px 28px rgba(34,80,126,.2);cursor:pointer;user-select:none;transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease}
    .brand-mark.counter-enabled{border:3px solid #6f9fd1;box-shadow:0 0 0 3px rgba(111,159,209,.12),0 10px 30px rgba(34,80,126,.32);transform:scale(1.035)}
    .collision-counter{position:absolute;top:22px;right:24px;z-index:3;display:flex;flex-direction:column;align-items:flex-end;gap:1px;opacity:0;visibility:hidden;transform:translateY(-6px) scale(.96);transition:opacity .22s ease,transform .24s cubic-bezier(.2,.8,.2,1),visibility 0s linear .24s;pointer-events:none}
    .collision-counter.visible{opacity:1;visibility:visible;transform:translateY(0) scale(1);transition-delay:0s}
    .collision-count{min-width:42px;color:#dbeaff;font:800 1.55rem/1 Georgia,"Times New Roman",serif;text-align:right;font-variant-numeric:tabular-nums;text-shadow:0 0 18px rgba(111,159,209,.2)}
    .collision-count.bump{animation:collisionCountBump .3s cubic-bezier(.2,.8,.2,1)}
    .collision-label{color:#7898b9;font-size:.54rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
    @keyframes collisionCountBump{0%{transform:scale(1)}45%{transform:scale(1.18);color:#fff}100%{transform:scale(1)}}
    h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(2.6rem,8vw,4rem);line-height:.98;letter-spacing:-.045em;color:#fff;text-shadow:2px 2px 0 #2c2c31}
    .brand-title .brand-ar{color:#6f9fd1}
    .brand-title .brand-matic{color:#fff}
    .landing-subtitle{max-width:390px;margin:14px auto 0;color:#a4a4ae;font-size:.97rem;line-height:1.55}
    .upload-zone{margin-top:30px;padding:18px;border:1px dashed #3d4e62;border-radius:12px;background:#13161a;transition:.16s ease}
    .upload-zone.dragging{border-color:#70a7df;background:#161d25;transform:translateY(-1px)}
    .upload-button{width:100%;border:1px solid #6698d0;border-radius:11px;padding:15px 22px;background:var(--blue);color:#fff;font-size:1.02rem;font-weight:800;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.13);transition:.16s ease}
    .upload-button:hover{background:#5e93cc;transform:translateY(-1px);box-shadow:0 8px 22px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.16)}
    .upload-hint{margin-top:10px;color:#777783;font-size:.78rem}
    .logo-speed-control{margin-top:12px;padding:2px 3px 0}
    .logo-speed-slider{width:100%;height:5px;display:block;margin:0;accent-color:var(--blue);cursor:pointer}
    .error-card{display:none;margin-top:18px;padding:13px 14px;border:1px solid #623b3b;border-radius:9px;background:#241718;color:#e3a5a5;font-size:.84rem;line-height:1.45}.error-card.visible{display:block}
    .app{display:none;width:min(94vw,1480px);margin:0 auto;padding:38px 0 74px}.app.active{display:block}
    .app-header{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:28px}
    .app-brand{cursor:pointer;user-select:none}.app-brand h1{font-size:clamp(2.15rem,4vw,3rem)}.app-brand p{margin-top:7px;color:var(--muted);font-size:.9rem}
    .app-header-actions{display:flex;align-items:center;justify-content:flex-end;gap:9px}
    .header-action-button{height:42px;min-width:108px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #44444b;border-radius:10px;padding:0 15px;background:#242429;color:#d8d8de;font-size:.79rem;font-weight:800;letter-spacing:.005em;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.025);transition:background .15s ease,border-color .15s ease,color .15s ease,transform .15s ease,box-shadow .15s ease}
    .header-action-button:hover:not(:disabled),.header-action-button:focus-visible{background:#2e2e34;border-color:#5a5a63;color:#fff;transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.035);outline:none}
    .header-action-button:active:not(:disabled){transform:translateY(0)}
    .header-action-button:disabled{opacity:.4;cursor:default}
    .file-strip{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px;padding:13px 16px;border:1px solid var(--soft);border-radius:10px;background:#121215;color:#b8b8c0;font-size:.84rem}
    .file-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#e5e5e9;font-weight:700}.file-meta{flex:0 0 auto;color:#7f7f89}
    .analysis-grid{display:grid;grid-template-columns:minmax(320px,.82fr) minmax(0,1.18fr);gap:20px;align-items:start}
    .panel{min-width:0;overflow:hidden;border:1px solid var(--border);border-radius:13px;background:var(--panel);box-shadow:0 16px 46px rgba(0,0,0,.25)}
    .panel-header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 18px;border-bottom:1px solid #2d2d33;background:#1b1b1f}
    .panel-title{color:#f1f1f4;font-size:.9rem;font-weight:800}.status{display:inline-flex;align-items:center;gap:7px;color:#8fbe9d;font-size:.76rem;font-weight:800}.status-dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 12px rgba(101,180,126,.5)}
    .terminal{min-height:320px;max-height:520px;overflow:auto;padding:18px;background:linear-gradient(rgba(81,133,189,.025) 1px,transparent 1px);background-size:100% 25px;font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
    .terminal-line{display:flex;gap:10px;min-height:25px;color:#c8c8cf;font-size:.79rem;line-height:1.65}.prompt{flex:0 0 auto;color:#6599d0;font-weight:800}.terminal-line.success .prompt{color:var(--green)}.terminal-line.muted{color:#777781}
    .cursor{display:inline-block;width:7px;height:1.05em;margin-left:2px;vertical-align:-.12em;background:#8ab5e0;animation:blink .75s steps(1) infinite}@keyframes blink{50%{opacity:0}}
    .summary{padding:18px}.hero-event{margin-bottom:18px;padding:18px;border:1px solid #354151;border-radius:11px;background:radial-gradient(circle at 100% 0%,rgba(81,133,189,.13),transparent 44%),#15181c}
    .eyebrow{color:#74a5d9;font-size:.68rem;font-weight:850;letter-spacing:.09em;text-transform:uppercase}.event-title{margin-top:7px;color:#fff;font-size:clamp(1.35rem,3vw,2rem);font-weight:850;letter-spacing:-.03em;line-height:1.1}.event-subtitle{margin-top:8px;color:#9797a1;font-size:.86rem;line-height:1.45}
    .quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.quick-card,.field{min-width:0;padding:12px 13px;border:1px solid #2d2d33;border-radius:9px;background:#151519}
    .quick-label,.field-label{color:#7f7f89;font-size:.66rem;font-weight:800;letter-spacing:.055em;text-transform:uppercase}.quick-value,.field-value{margin-top:5px;overflow-wrap:anywhere;color:#e8e8ec;font-size:.88rem;font-weight:720;line-height:1.35}
    .details{grid-column:1/-1;margin-top:20px}.details-body{padding:18px}.section-block+.section-block{margin-top:22px;padding-top:22px;border-top:1px solid #29292f}.section-heading{margin-bottom:12px;color:#e9e9ed;font-size:.93rem;font-weight:850}
    .field-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.field{padding:11px 12px;border-color:#2b2b31}.field.wide{grid-column:1/-1}.field-value{color:#dedee4;font-size:.82rem;font-weight:400}
    .raw-toggle{display:inline-flex;align-items:center;gap:8px;border:0;padding:0;background:transparent;color:#8faed0;font-size:.78rem;font-weight:750;cursor:pointer}.raw-text{display:none;max-height:460px;overflow:auto;margin-top:12px;padding:14px;border:1px solid #29292f;border-radius:9px;background:#101013;color:#9b9ba5;font:.72rem/1.55 "SFMono-Regular",Consolas,monospace;white-space:pre-wrap;word-break:break-word}.raw-text.open{display:block}
    .reveal{opacity:0;transform:translateY(7px);transition:opacity .28s ease,transform .28s ease}.reveal.show{opacity:1;transform:translateY(0)}
    @media(max-width:1000px){.analysis-grid{grid-template-columns:1fr}.details{grid-column:auto}.field-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:700px){.app{width:min(92vw,1480px);padding-top:26px}.app-header{align-items:flex-start;flex-direction:column}.app-header-actions{width:100%;justify-content:flex-start}.field-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.quick-grid{grid-template-columns:1fr}.landing-card{padding:42px 24px 30px}}
    @media(max-width:430px){.field-grid{grid-template-columns:1fr}.file-strip{align-items:flex-start;flex-direction:column;gap:6px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  
    .scan-panel{margin-bottom:20px}
    .scan-panel .terminal{min-height:0;max-height:190px}
    .scan-progress{height:3px;background:#24242a;overflow:hidden}
    .scan-progress-bar{width:0;height:100%;background:#5e93cc;transition:width .65s cubic-bezier(.22,.61,.36,1);will-change:width}
    .events-head{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:24px;margin:28px 0 14px}
    .events-title-group{display:flex;align-items:center;gap:16px;min-width:0;justify-self:start}
    .events-head h2{font-size:1.1rem;color:#f4f4f6}
    .events-progress{display:flex;align-items:center;gap:8px;min-width:150px}
    .events-progress-track{width:118px;height:6px;overflow:hidden;border-radius:999px;background:#29292f;border:1px solid #33333a}
    .events-progress-bar{width:0;height:100%;border-radius:999px;background:#79c990;transition:width .24s ease}
    .events-progress-text{min-width:32px;color:#9aa0a7;font-size:.7rem;font-weight:850;font-variant-numeric:tabular-nums}
    .portfolio-sales{position:relative;justify-self:center;min-width:240px;text-align:center;line-height:1;color:inherit;text-decoration:none;cursor:pointer;outline:none}
    .portfolio-sales::before{content:attr(data-hover);position:absolute;left:50%;bottom:calc(100% + 7px);padding:5px 8px;border:1px solid #34343b;border-radius:7px;background:#17171b;color:#fff;font-size:.6rem;font-weight:800;letter-spacing:.01em;white-space:pre-line;text-align:center;line-height:1.3;opacity:0;pointer-events:none;transform:translate(-50%,7px);transition:opacity .16s ease,transform .18s ease;box-shadow:0 6px 18px rgba(0,0,0,.28)}
    .portfolio-sales:hover::before,.portfolio-sales:focus-visible::before{opacity:1;transform:translate(-50%,0)}
    .portfolio-sales:has(.game-user-flag:hover)::before{opacity:0}
    .portfolio-sales-value-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center}
    .portfolio-sales-value{grid-column:2;color:#f5f5f7;font-size:1.85rem;font-weight:950;letter-spacing:-.035em;font-variant-numeric:tabular-nums;text-shadow:0 5px 22px rgba(0,0,0,.35);transition:color .14s ease,text-shadow .14s ease}
    .game-user-flag{grid-column:3;justify-self:start;width:28px;height:28px;margin-left:10px;display:none;align-items:center;justify-content:center;border:1px solid #d9822b;border-radius:50%;background:#3a2410;color:#ff9b3d;font-size:1.05rem;font-weight:950;line-height:1;cursor:default;box-shadow:0 4px 13px rgba(0,0,0,.22);text-shadow:0 1px 5px rgba(255,155,61,.2);transform:scale(.65);opacity:0;position:relative}
    .game-user-flag.visible{display:flex;animation:gameUserFlagPop .38s cubic-bezier(.2,.85,.25,1.25) forwards}
    .game-user-flag::after{content:attr(data-tooltip);position:absolute;left:50%;bottom:36px;min-width:max-content;padding:6px 8px;border:1px solid #5d3a1c;border-radius:7px;background:#17171b;color:#ffc180;font-size:.61rem;font-weight:800;letter-spacing:0;white-space:nowrap;text-align:left;line-height:1.35;box-shadow:0 5px 16px rgba(0,0,0,.28);opacity:0;pointer-events:none;transform:translate(-50%,3px);transition:.14s ease}
    .game-user-flag:hover::after{opacity:1;transform:translate(-50%,0)}
    @keyframes gameUserFlagPop{0%{opacity:0;transform:scale(.55) rotate(-12deg)}70%{opacity:1;transform:scale(1.12) rotate(3deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
    .portfolio-sales:hover .portfolio-sales-value,.portfolio-sales:focus-visible .portfolio-sales-value{color:#9fc4ec;text-shadow:0 0 12px rgba(111,159,209,.24),0 5px 22px rgba(0,0,0,.35)}
    .portfolio-sales-date{margin-top:7px;color:#9a9aa4;font-size:.76rem;font-weight:750;letter-spacing:.01em}
    .events-actions{display:flex;align-items:center;justify-content:flex-end;gap:12px;min-width:0;justify-self:end}
    .event-count{color:#8fbe9d;font-size:.8rem;font-weight:800;white-space:nowrap}
    .recap-upload-button{border:1px solid #9b5b78;border-radius:9px;padding:8px 13px;background:#2d1f27;color:#e9a7c6;font-size:.75rem;font-weight:850;cursor:pointer;transition:.15s ease;white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,183,218,.05)}
    .recap-upload-button:hover:not(:disabled){background:#3a2530;border-color:#b86b90;color:#f6bfd8}
    .recap-upload-button:disabled{opacity:.4;cursor:default}
    .toast-upload-button{border:1px solid #9c744d;border-radius:9px;padding:8px 13px;background:#2b241d;color:#e7bc91;font-size:.75rem;font-weight:850;cursor:pointer;transition:.15s ease;white-space:nowrap}
    .toast-upload-button:hover:not(:disabled){background:#382b20;border-color:#ba8958;color:#f0cba8}
    .toast-upload-button:disabled{opacity:.4;cursor:default}
    .export-button{border:1px solid #47729e;border-radius:9px;padding:8px 13px;background:#1b2a39;color:#a9cef1;font-size:.75rem;font-weight:850;cursor:pointer;transition:.15s ease}
    .export-button:hover:not(:disabled){background:#22374b;border-color:#5c8bbb;color:#c0dcf5}
    .export-button:disabled{opacity:.4;cursor:default}
    .events-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
    .event-card{min-width:0;overflow:hidden;border:1px solid #303036;border-radius:13px;background:#18181b;box-shadow:0 12px 34px rgba(0,0,0,.22);transition:transform .16s ease,border-color .16s ease}
    .event-card.event-enter{animation:eventCardIn .42s cubic-bezier(.2,.78,.25,1) both}
    @keyframes eventCardIn{0%{opacity:0;transform:translateY(14px) scale(.985)}60%{opacity:1}100%{opacity:1;transform:translateY(0) scale(1)}}
    .event-card:hover{transform:translateY(-2px);border-color:#494951}
    .add-event-slot{min-height:260px;display:grid;place-items:center;align-self:stretch}
    .add-event-slot:nth-child(3n+1){grid-column:1/-1}
    .add-event-button{width:44px;height:44px;border:1px solid #30343a;border-radius:50%;background:#121417;color:#6f7780;font-size:1.55rem;font-weight:300;line-height:1;cursor:pointer;transition:.16s ease;box-shadow:0 6px 20px rgba(0,0,0,.14)}
    .add-event-button:hover{border-color:#4e6174;background:#171b20;color:#8fa9c2;transform:scale(1.04)}
    .event-preview{position:relative;height:190px;display:grid;place-items:center;overflow:hidden;background:#efefef;border-bottom:1px solid #303036;cursor:pointer}
    .event-preview canvas{display:block;max-width:100%;max-height:100%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.2)}
    .event-card-body{position:relative;padding:15px}
    .event-kicker{display:flex;justify-content:space-between;gap:10px;color:#6f9fd1;font-size:.72rem;font-weight:850;letter-spacing:.07em;text-transform:uppercase}
    .event-entered-check{position:absolute;right:15px;top:43px;width:25px;height:25px;display:grid;place-items:center;border:1px solid #454b53;border-radius:7px;background:#131519;color:transparent;cursor:pointer;transition:background .16s ease,border-color .16s ease,box-shadow .16s ease,transform .12s ease}
    .event-entered-check:hover{border-color:#6f9fd1;background:#17202a}
    .event-entered-check:active{transform:scale(.93)}
    .event-entered-check::after{content:"✓";font-size:.88rem;font-weight:950;line-height:1;transform:scale(.45) rotate(-10deg);opacity:0;transition:transform .2s cubic-bezier(.2,.85,.25,1.25),opacity .14s ease}
    .event-entered-check.checked{border-color:#6f9fd1;background:#1a3550;box-shadow:0 0 0 2px rgba(81,133,189,.09),0 4px 14px rgba(0,0,0,.2)}
    .event-entered-check.checked::after{color:#b9d8f6;opacity:1;transform:scale(1) rotate(0)}
    .event-entered-check:focus-visible{outline:2px solid #6f9fd1;outline-offset:2px}
    .entered-progress-float{position:fixed;z-index:35;left:5px;top:5px;width:190px;padding:11px 12px;border:1px solid #2f3f50;border-radius:10px;background:rgba(18,20,24,.94);box-shadow:0 10px 30px rgba(0,0,0,.28);backdrop-filter:blur(8px);opacity:0;visibility:hidden;pointer-events:none;transform:translateY(-8px) scale(.97);transition:opacity .22s ease,transform .24s cubic-bezier(.2,.8,.2,1),visibility 0s linear .24s}
    .entered-progress-float.visible{opacity:1;visibility:visible;pointer-events:auto;transform:translateY(0) scale(1);transition-delay:0s}
    .entered-progress-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
    .entered-progress-label{color:#9fc4ec;font-size:.68rem;font-weight:900;letter-spacing:.055em;text-transform:uppercase}
    .entered-progress-text{color:#bfc6cf;font-size:.68rem;font-weight:850;font-variant-numeric:tabular-nums}
    .entered-progress-track{height:6px;overflow:hidden;border:1px solid #35404c;border-radius:999px;background:#242a31}
    .entered-progress-bar{width:0;height:100%;border-radius:999px;background:#5e93cc;transition:width .3s cubic-bezier(.2,.75,.25,1)}
    .preview-entered-strip{position:fixed;z-index:1003;top:10px;left:50%;display:flex;align-items:center;justify-content:center;gap:10px;transform:translateX(-50%);pointer-events:auto}
    .preview-entered-check{position:static;right:auto;top:auto;flex:0 0 auto;width:24px;height:24px}
    .preview-entered-progress{display:flex;align-items:center;gap:7px}
    .preview-entered-track{width:120px;height:6px;overflow:hidden;border:1px solid #35404c;border-radius:999px;background:#242a31}
    .preview-entered-bar{width:0;height:100%;border-radius:999px;background:#5e93cc;transition:width .3s cubic-bezier(.2,.75,.25,1)}
    .preview-entered-text{min-width:30px;color:#bfc6cf;font-size:.68rem;font-weight:850;font-variant-numeric:tabular-nums}
    .event-toast-link{color:inherit;text-decoration:none;cursor:pointer;transition:color .14s ease,text-shadow .14s ease}
    .event-toast-link:hover,.event-toast-link:focus-visible{color:#3f6f9f;text-shadow:0 0 10px rgba(63,111,159,.22)}
    .event-name{margin-top:7px;padding-right:38px;color:#fff;font-size:1.05rem;font-weight:850;line-height:1.2;overflow-wrap:anywhere}
    .event-name-link,.modal-event-link{color:inherit;text-decoration:none;cursor:pointer;transition:color .14s ease,text-shadow .14s ease}
    .event-name-link:hover,.modal-event-link:hover{color:#9fc4ec;text-shadow:0 0 12px rgba(111,159,209,.24)}
    .event-corner-actions{position:absolute;top:10px;right:10px;z-index:4;display:flex;align-items:center;justify-content:flex-end;min-width:28px;min-height:28px}
    .event-tags{position:relative;z-index:2;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:100%;transition:transform .18s ease}
    .event-delete-button{position:absolute;right:0;top:50%;width:26px;height:26px;display:grid;place-items:center;border:1px solid #b9bbc1;border-radius:50%;background:#e7e7ea;color:#5f6168;font-size:.9rem;font-weight:800;line-height:1;cursor:pointer;opacity:0;transform:translate(9px,-50%) scale(.86);pointer-events:none;transition:opacity .16s ease,transform .18s ease,background .14s ease,color .14s ease}
    .event-corner-actions:hover .event-tags,.event-corner-actions:focus-within .event-tags{transform:translateX(-34px)}
    .event-corner-actions:hover .event-delete-button,.event-corner-actions:focus-within .event-delete-button{opacity:1;transform:translate(0,-50%) scale(1);pointer-events:auto}
    .event-delete-button:hover{background:#d8d8dc;color:#34363b}

  <svg width="0" height="0" aria-hidden="true" style="position:absolute;pointer-events:none">

    function startFloatingTopgolfLogo() {

      const logoColorFlood = document.getElementById("topgolfLogoFlood");

      let x = 0;
      let y = 0;
      let vx = 105;
      let vy = 82;
      let lastTime = performance.now();
      let started = false;
      let mask = null;
      let lastHue = null;
      let collisionTotal = 0;
      let counterVisible = false;
      let speedMultiplier = Number(logoSpeedSlider?.value || 1);

      // Use the solid visible portion of the white PNG for collision detection.
      // The small inset intentionally lets the visible edge get truly flush
      // with a wall/card instead of bouncing on barely-visible edge pixels.
      const alphaThreshold = 200;
      const touchInset = 2;

      function setCounterVisible(nextVisible) {
        counterVisible=Boolean(nextVisible);
        landingBrandMark?.classList.toggle("counter-enabled",counterVisible);

      function placeLogo() {
        floatingTopgolfLogo.style.transform = `translate3d(${x}px, ${y}px, 0)`;
      }

      function randomizeLogoColor() {
        if (!logoColorFlood) return;

        let hue = Math.floor(Math.random() * 360);

        if (lastHue !== null) {
          let attempts = 0;
          while (
            Math.min(Math.abs(hue - lastHue), 360 - Math.abs(hue - lastHue)) < 45 &&
            attempts < 20
          ) {
            hue = Math.floor(Math.random() * 360);
            attempts++;
          }
        }

        lastHue = hue;
        const saturation = 82 + Math.floor(Math.random() * 17);
        const lightness = 54 + Math.floor(Math.random() * 12);
        logoColorFlood.setAttribute(
          "flood-color",
          `hsl(${hue} ${saturation}% ${lightness}%)`
        );
      }

      function rebuildPixelMask() {
        const width = Math.max(1, Math.round(floatingTopgolfLogo.offsetWidth));
        const height = Math.max(1, Math.round(floatingTopgolfLogo.offsetHeight));

        if (!floatingTopgolfLogo.naturalWidth || !floatingTopgolfLogo.naturalHeight) return false;

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        if (!ctx) return false;

        ctx.clearRect(0, 0, width, height);
        ctx.drawImage(floatingTopgolfLogo, 0, 0, width, height);

        const pixels = ctx.getImageData(0, 0, width, height).data;
        const alpha = new Uint8Array(width * height);

        let minX = width;
        let minY = height;
        let maxX = -1;
        let maxY = -1;

        for (let py = 0; py < height; py++) {
          for (let px = 0; px < width; px++) {
            const a = pixels[(py * width + px) * 4 + 3];
            if (a < alphaThreshold) continue;

            alpha[py * width + px] = 1;
            if (px < minX) minX = px;
            if (px > maxX) maxX = px;
            if (py < minY) minY = py;
            if (py > maxY) maxY = py;
          }
        }

        if (maxX < minX || maxY < minY) {
          minX = 0;
          minY = 0;
          maxX = width - 1;
          maxY = height - 1;
        }

        mask = { width, height, alpha, minX, minY, maxX, maxY };
        return true;
      }

      function cardShape() {
        const source = landingCard.getBoundingClientRect();
        const rect = {
          left: source.left + touchInset,
          right: source.right - touchInset,
          top: source.top + touchInset,
          bottom: source.bottom - touchInset,
          width: Math.max(0, source.width - touchInset * 2),
          height: Math.max(0, source.height - touchInset * 2)
        };
        const sourceRadius = parseFloat(getComputedStyle(landingCard).borderRadius) || 0;
        const radius = Math.max(0, sourceRadius - touchInset);
        return { rect, radius };
      }

      function pointInsideRoundedRect(px, py, rect, radius) {
        if (px < rect.left || px > rect.right || py < rect.top || py > rect.bottom) {
          return false;
        }

        const r = Math.min(radius, rect.width / 2, rect.height / 2);
        if (r <= 0) return true;

        const innerLeft = rect.left + r;
        const innerRight = rect.right - r;
        const innerTop = rect.top + r;
        const innerBottom = rect.bottom - r;

        if (px >= innerLeft && px <= innerRight) return true;
        if (py >= innerTop && py <= innerBottom) return true;

        const cx = px < innerLeft ? innerLeft : innerRight;
        const cy = py < innerTop ? innerTop : innerBottom;
        const dx = px - cx;
        const dy = py - cy;

        return dx * dx + dy * dy <= r * r;
      }

      function pixelMaskHitsCard(testX, testY) {
        if (!mask) return false;

        const { rect, radius } = cardShape();

        const logoLeft = testX + mask.minX;
        const logoRight = testX + mask.maxX + 1;
        const logoTop = testY + mask.minY;
        const logoBottom = testY + mask.maxY + 1;

        if (
          logoRight <= rect.left ||
          logoLeft >= rect.right ||
          logoBottom <= rect.top ||
          logoTop >= rect.bottom
        ) {
          return false;
        }

        const startX = Math.max(mask.minX, Math.floor(rect.left - testX) - 1);
        const endX = Math.min(mask.maxX, Math.ceil(rect.right - testX) + 1);
        const startY = Math.max(mask.minY, Math.floor(rect.top - testY) - 1);
        const endY = Math.min(mask.maxY, Math.ceil(rect.bottom - testY) + 1);

        for (let py = startY; py <= endY; py++) {
          const row = py * mask.width;
          const screenY = testY + py + 0.5;

          for (let px = startX; px <= endX; px++) {
            if (!mask.alpha[row + px]) continue;

            const screenX = testX + px + 0.5;
            if (pointInsideRoundedRect(screenX, screenY, rect, radius)) {
              return true;
            }
          }
        }

        return false;
      }

      function findLastSafePosition(fromX, fromY, toX, toY) {
        let low = 0;
        let high = 1;

        // Binary-search the motion path so the logo stops essentially flush
        // with the card instead of jumping back an entire animation frame.
        for (let i = 0; i < 18; i++) {
          const mid = (low + high) / 2;
          const testX = fromX + (toX - fromX) * mid;
          const testY = fromY + (toY - fromY) * mid;

          if (pixelMaskHitsCard(testX, testY)) {
            high = mid;
          } else {
            low = mid;
          }
        }

        return {
          x: fromX + (toX - fromX) * low,
          y: fromY + (toY - fromY) * low
        };
      }

      function clampToVisiblePixels() {
        if (!mask) return;

        const minAllowedX = -mask.minX - touchInset;
        const maxAllowedX = window.innerWidth - (mask.maxX + 1) + touchInset;
        const minAllowedY = -mask.minY - touchInset;
        const maxAllowedY = window.innerHeight - (mask.maxY + 1) + touchInset;

        x = Math.min(Math.max(x, minAllowedX), maxAllowedX);
        y = Math.min(Math.max(y, minAllowedY), maxAllowedY);
      }

      function randomizeStart() {
        if (!mask) return;

        const minAllowedX = -mask.minX;
        const maxAllowedX = Math.max(minAllowedX, window.innerWidth - (mask.maxX + 1));
        const minAllowedY = -mask.minY;
        const maxAllowedY = Math.max(minAllowedY, window.innerHeight - (mask.maxY + 1));

        let found = false;

        for (let attempt = 0; attempt < 200; attempt++) {
          const testX = minAllowedX + Math.random() * (maxAllowedX - minAllowedX);
          const testY = minAllowedY + Math.random() * (maxAllowedY - minAllowedY);

          if (!pixelMaskHitsCard(testX, testY)) {
            x = testX;
            y = testY;
            found = true;
            break;
          }
        }

        if (!found) {
          x = minAllowedX;
          y = minAllowedY;
        }

        vx = Math.abs(vx) * (Math.random() < 0.5 ? -1 : 1);
        vy = Math.abs(vy) * (Math.random() < 0.5 ? -1 : 1);
        placeLogo();
      }

      function resolveWindowEdges(nextX, nextY) {
        if (!mask) return { x: nextX, y: nextY, collided: false };

        const minAllowedX = -mask.minX - touchInset;
        const maxAllowedX = window.innerWidth - (mask.maxX + 1) + touchInset;
        const minAllowedY = -mask.minY - touchInset;
        const maxAllowedY = window.innerHeight - (mask.maxY + 1) + touchInset;

        let collided = false;

        if (nextX <= minAllowedX) {
          nextX = minAllowedX;
          vx = Math.abs(vx);
          collided = true;
        } else if (nextX >= maxAllowedX) {
          nextX = maxAllowedX;
          vx = -Math.abs(vx);
          collided = true;
        }

        if (nextY <= minAllowedY) {
          nextY = minAllowedY;
          vy = Math.abs(vy);
          collided = true;
        } else if (nextY >= maxAllowedY) {
          nextY = maxAllowedY;
          vy = -Math.abs(vy);
          collided = true;
        }

        return { x: nextX, y: nextY, collided };
      }

      function resolveCardCollision(oldX, oldY, nextX, nextY) {
        if (!pixelMaskHitsCard(nextX, nextY)) {
          return { x: nextX, y: nextY, collided: false };
        }

        const hitsFromX = pixelMaskHitsCard(nextX, oldY);
        const hitsFromY = pixelMaskHitsCard(oldX, nextY);

        let contact;

        if (hitsFromX && !hitsFromY) {
          contact = findLastSafePosition(oldX, nextY, nextX, nextY);
          vx = -vx;
        } else if (!hitsFromX && hitsFromY) {
          contact = findLastSafePosition(nextX, oldY, nextX, nextY);
          vy = -vy;
        } else {
          contact = findLastSafePosition(oldX, oldY, nextX, nextY);
          vx = -vx;
          vy = -vy;
        }

        return { x: contact.x, y: contact.y, collided: true };
      }

      function animate(now) {
        if (landing.style.display === "none") return;

        if (!started || !mask) {
          requestAnimationFrame(animate);
          return;
        }

        const dt = Math.min((now - lastTime) / 1000, 0.032);
        lastTime = now;

        const oldX = x;
        const oldY = y;

        let nextX = x + vx * speedMultiplier * dt;
        let nextY = y + vy * speedMultiplier * dt;
        let collided = false;

        const edgeResult = resolveWindowEdges(nextX, nextY);
        nextX = edgeResult.x;
        nextY = edgeResult.y;
        collided = collided || edgeResult.collided;

        const cardResult = resolveCardCollision(oldX, oldY, nextX, nextY);
        nextX = cardResult.x;
        nextY = cardResult.y;
        collided = collided || cardResult.collided;

        x = nextX;
        y = nextY;

        if (collided) {
          randomizeLogoColor();
          recordCollision();
        }

        placeLogo();
        requestAnimationFrame(animate);
      }

      function initialize() {
        if (!rebuildPixelMask()) return;

        randomizeStart();
        lastTime = performance.now();
        started = true;
      }

        event.preventDefault();

        if (!rebuildPixelMask()) return;

        clampToVisiblePixels();

        if (pixelMaskHitsCard(x, y)) {
          randomizeStart();
        } else {
          placeLogo();
        }
      });

      requestAnimationFrame(animate);
    }

    function bytesToBase64(bytes){
      if(!bytes||!bytes.length)return null;

      let binary="";
      const chunkSize=0x8000;

      for(let offset=0;offset<bytes.length;offset+=chunkSize){
        binary+=String.fromCharCode(...bytes.subarray(
          offset,
          Math.min(bytes.length,offset+chunkSize)
        ));
      }

      return btoa(binary);
    }

    function base64ToBytes(value){
      if(!value)return null;

      const binary=atob(String(value));
      const bytes=new Uint8Array(binary.length);

      for(let i=0;i<binary.length;i++){
        bytes[i]=binary.charCodeAt(i);
      }

      return bytes;
    }

        };
      }

      return value;
    }

    function armaticJsonReviver(key,value){

        return new Set(Array.isArray(value.values)?value.values:[]);

      if(value&&value.__armaticType==="Map"){
        return new Map(Array.isArray(value.entries)?value.entries:[]);
      }

      return value;
    }

    function restoreGroupUi(group,savedUi){
      const ui=group?.ui;
      if(!ui||!savedUi)return;

      if(savedUi.noToastData){
        showNoToastData(group);
      }

      ui.contracted.open=Boolean(savedUi.contractedOpen);
      ui.scanLog.textContent=String(savedUi.scanLogText||"");
      ui.scanLog.classList.toggle("visible",Boolean(savedUi.scanLogVisible));
      ui.pasteZone.style.display=String(savedUi.pasteZoneDisplay||"");
      ui.pasteZone.classList.toggle(
        "processing",
        Boolean(savedUi.pasteZoneProcessing)
      );
      ui.replaceButton.classList.toggle(
        "visible",
        Boolean(savedUi.replaceVisible)
      );
      ui.replaceButton.style.display=String(savedUi.replaceDisplay||"");

      if(savedUi.subtotalClassName){
        ui.subtotalCheck.className=String(savedUi.subtotalClassName);
        ui.subtotalCheck.textContent=String(savedUi.subtotalText||"");

        if(savedUi.subtotalTooltip){
          ui.subtotalCheck.dataset.tooltip=String(savedUi.subtotalTooltip);
        }else{
          delete ui.subtotalCheck.dataset.tooltip;
        }

        if(savedUi.subtotalAriaLabel){
          ui.subtotalCheck.setAttribute(
            "aria-label",
            String(savedUi.subtotalAriaLabel)
          );
        }else{
          ui.subtotalCheck.removeAttribute("aria-label");
        }
      }

      syncOpportunityFlag(group);
    }

          fileNameText:fileName.textContent||"",
          fileMetaText:fileMeta.textContent||"",
          statusText:clean(status.textContent||"Complete"),
          scanProgressWidth:scanProgressBar.style.width||"100%",

        currentSourceBytes=bytes.slice();

        fileMeta.textContent=formatBytes(file.size)+" · "+sourcePdf.numPages+(sourcePdf.numPages===1?" page":" pages");
        await terminalMessage("Mapping "+sourcePdf.numPages+" pages and locating event boundaries…");

        const pageRecords=[];
        for(let n=1;n<=sourcePdf.numPages;n++){
          const page=await sourcePdf.getPage(n);
          const lines=await extractLines(page);
          const text=lines.join("\n");
          pageRecords.push({pageNumber:n,lines,text});
          scanProgressBar.style.width=((n/sourcePdf.numPages)*38).toFixed(2)+"%";
        }

        const groups=buildEventGroups(pageRecords);
        previewPageCache.clear();
        currentGroups=groups;
        eventCount.textContent=groups.length+(groups.length===1?" event":" events");
        updateEventsProgress();
        await terminalMessage("Found "+groups.length+(groups.length===1?" event.":" events."),"success");

        if(!groups.length){
          status.innerHTML='<span class="status-dot"></span> Complete';
          scanProgressBar.style.width="100%";
          emptyEvents.style.display="block";
          return;
        }

        for(const group of groups){
          group.parsed=parseEvent(group);

          if(group.parsed.tags.includes("Play It Forward")){
            const zeroComparison={
              items:[{
                label:"Play It Forward",

                contracted:0,

              grossTotal:0,

                totalAR:0,
                expectedAR:0,
                contractedSubtotal:0,
                arDifference:0,
                discrepancy:0
              },
              toastServiceCharge:0,
              recognizedCount:1,
              autoZero:true
            };

            group.parsed.arProcessed=true;
            group.parsed.arComparison=zeroComparison;
            group.arComparison=zeroComparison;
          }else{
            group.parsed.arProcessed=false;
            group.parsed.arComparison=null;
          }
        }

        groups.sort((a,b)=>{
          const aCard=Number(a.parsed.eventCard);
          const bCard=Number(b.parsed.eventCard);
          const aHas=Number.isFinite(aCard);
          const bHas=Number.isFinite(bCard);

          if(aHas&&bHas)return aCard-bCard;
          if(aHas)return -1;
          if(bHas)return 1;

          return String(a.parsed.eventCard||"").localeCompare(
            String(b.parsed.eventCard||""),
            undefined,
            {numeric:true,sensitivity:"base"}
          );
        });

        currentGroups=groups;
        updateEventsProgress();
        updatePortfolioSales();
        exportButton.disabled=false;

        let index=0;
        for(const group of groups){
          index++;
          const parsed=group.parsed;

          const trimmed=await buildTrimmedEventPdf(sourcePdfLib,group.pageNumbers);
          group.pdfBytes=trimmed;
          group.pdf=await pdfjsLib.getDocument({data:trimmed.slice()}).promise;

          const card=await renderEventCard(group,index,groups.length);
          eventsGrid.appendChild(card);
          preloadEventPreview(group).catch(()=>{});

          const detail=[parsed.name,parsed.date,parsed.time,parsed.guests?parsed.guests+" guests":null].filter(Boolean).join(" · ");
          await terminalMessage(String(index).padStart(2,"0")+"/"+String(groups.length).padStart(2,"0")+"  "+detail,"success");

          scanProgressBar.style.width=(38+((index/groups.length)*62)).toFixed(2)+"%";
        }

        status.innerHTML='<span class="status-dot"></span> Complete';
        scanProgressBar.style.width="100%";
        recapUploadButton.disabled=false;
        toastUploadButton.disabled=false;
        refreshAddEventSlot();
        await terminalMessage("All events separated and analyzed.","success");
      }catch(err){
        console.error(err);
        status.innerHTML='<span class="status-dot"></span> Error';
        await terminalMessage("Could not finish reading this PDF.","muted");
      }
    }

    function opportunityTemplateCovers(x,y){
      const spans=opportunityHeaderTemplateSpans[y];
      if(!spans)return false;

      for(const span of spans){
        if(x>=span[0]&&x<=span[1])return true;
      }

      return false;

    async function detectOpportunityMark(pdf,pageNumber){
      const page=await pdf.getPage(pageNumber);
      const base=page.getViewport({scale:1});
      const width=600;
      const scale=width/base.width;
      const viewport=page.getViewport({scale});
      const canvas=document.createElement("canvas");
      const ctx=canvas.getContext("2d",{willReadFrequently:true});

      canvas.width=width;
      canvas.height=Math.max(1,Math.round(viewport.height));

      await page.render({
        canvasContext:ctx,
        viewport
      }).promise;

      // Only inspect the blank top-margin area above the printed "Event Recap"
      // heading. The earlier 72px band reached far enough down to let normal
      // form/title variation look like handwriting on noisy scans.
      const roiHeight=Math.min(96,canvas.height);
      const pixels=ctx.getImageData(0,0,width,roiHeight).data;

      // First pass: only keep genuinely dark pixels that are not part of the
      // known printed recap template. A stricter darkness cutoff keeps faint
      // scanner haze / dust from ever entering the detector.
      const candidate=new Uint8Array(width*roiHeight);
      const redCandidate=new Uint8Array(width*roiHeight);

      for(let y=0;y<roiHeight;y++){
        for(let x=45;x<555;x++){
          if(y>=58&&x>=205&&x<=395)continue;
          if(opportunityTemplateCovers(x,y))continue;

          const i=(y*width+x)*4;
          const r=pixels[i],g=pixels[i+1],b=pixels[i+2];
          const gray=(r+g+b)/3;
          const max=Math.max(r,g,b);
          const min=Math.min(r,g,b);
          const chroma=max-min;

          // Treat any meaningful pen ink as a candidate: black/gray writing,
          // or colored writing of any hue. The printed form is masked above,
          // and connected-component filtering below removes isolated scan noise.
          const darkOrBlack=gray<205;
          const colored=chroma>=18&&max<245;

          // Red ink is a deliberate override: if there is a real connected
          // red mark/area in this same header region, the recap should NOT be
          // flagged for opportunities. Keep this separate from normal colored
          // ink so a few reddish scan pixels cannot cancel a legitimate flag.
          const isRed=
            r>=105 &&
            r>=g*1.28 &&
            r>=b*1.28 &&
            (r-Math.max(g,b))>=28;

          if(isRed){
            redCandidate[y*width+x]=1;
          }

          if(darkOrBlack||colored){
            candidate[y*width+x]=1;
          }
        }
      }

      // Before normal opportunity scoring, check for a substantial connected
      // red mark. A solid red mark nullifies any opportunity detection.
      const redVisited=new Uint8Array(redCandidate.length);
      let redTotalInk=0;
      let largestRedComponent=0;
      let redSolidComponents=0;

      for(let seed=0;seed<redCandidate.length;seed++){
        if(!redCandidate[seed]||redVisited[seed])continue;

        const stack=[seed];
        redVisited[seed]=1;
        let area=0;
        let minX=width,maxX=0,minY=roiHeight,maxY=0;

        while(stack.length){
          const pos=stack.pop();
          const y=Math.floor(pos/width);
          const x=pos-y*width;

          area++;
          minX=Math.min(minX,x);
          maxX=Math.max(maxX,x);
          minY=Math.min(minY,y);
          maxY=Math.max(maxY,y);

          for(let dy=-1;dy<=1;dy++){
            for(let dx=-1;dx<=1;dx++){
              if(dx===0&&dy===0)continue;

              const nx=x+dx;
              const ny=y+dy;
              if(nx<45||nx>=555||ny<0||ny>=roiHeight)continue;
              if(ny>=58&&nx>=205&&nx<=395)continue;

              const ni=ny*width+nx;
              if(!redCandidate[ni]||redVisited[ni])continue;
              redVisited[ni]=1;
              stack.push(ni);
            }
          }
        }

        const componentWidth=maxX-minX+1;
        const componentHeight=maxY-minY+1;
        const boxArea=componentWidth*componentHeight;
        const density=boxArea>0?area/boxArea:0;

        if(area<12)continue;
        if(componentWidth<4||componentHeight<3)continue;
        if(density<0.07)continue;

        redTotalInk+=area;
        largestRedComponent=Math.max(largestRedComponent,area);

        if(
          area>=42 &&
          componentWidth>=8 &&
          componentHeight>=6
        ){
          redSolidComponents++;
        }
      }

      const hasRedOverride=
        redSolidComponents>=1 ||
        largestRedComponent>=55 ||
        redTotalInk>=95;

      if(hasRedOverride){
        return false;
      }

      // Second pass: remove salt-and-pepper scan noise. A real pen stroke has
      // neighboring dark pixels; isolated specks usually do not.
      const filtered=new Uint8Array(candidate.length);

      for(let y=1;y<roiHeight-1;y++){
        for(let x=46;x<554;x++){
          const index=y*width+x;
          if(!candidate[index])continue;

          let neighbors=0;

          for(let dy=-1;dy<=1;dy++){
            for(let dx=-1;dx<=1;dx++){
              if(dx===0&&dy===0)continue;
              if(candidate[(y+dy)*width+(x+dx)])neighbors++;
            }
          }

          if(neighbors>=2){
            filtered[index]=1;
          }
        }
      }

      const visited=new Uint8Array(filtered.length);
      let strongComponents=0;
      let mediumComponents=0;
      let totalValidInk=0;
      let largestValid=0;

      for(let seed=0;seed<filtered.length;seed++){
        if(!filtered[seed]||visited[seed])continue;

        const stack=[seed];
        visited[seed]=1;

        let area=0;
        let minX=width,maxX=0,minY=roiHeight,maxY=0;

        while(stack.length){
          const pos=stack.pop();
          const y=Math.floor(pos/width);
          const x=pos-y*width;

          area++;
          minX=Math.min(minX,x);
          maxX=Math.max(maxX,x);
          minY=Math.min(minY,y);
          maxY=Math.max(maxY,y);

          for(let dy=-1;dy<=1;dy++){
            for(let dx=-1;dx<=1;dx++){
              if(dx===0&&dy===0)continue;

              const nx=x+dx;
              const ny=y+dy;

              if(nx<45||nx>=555||ny<0||ny>=roiHeight)continue;
              if(ny>=58&&nx>=205&&nx<=395)continue;

              const ni=ny*width+nx;
              if(!filtered[ni]||visited[ni])continue;

              visited[ni]=1;
              stack.push(ni);
            }
          }
        }

        const componentWidth=maxX-minX+1;
        const componentHeight=maxY-minY+1;
        const boxArea=componentWidth*componentHeight;
        const density=boxArea>0?area/boxArea:0;
        const veryLongThin=
          (componentWidth>=55&&componentHeight<=3) ||
          (componentHeight>=45&&componentWidth<=3);
        const nearFullWidthHorizontalLine=
          componentWidth>=360 &&
          componentHeight<=18 &&
          componentWidth/componentHeight>=20;

        // Reject scanner crumbs, hairline streaks, very sparse artifacts, and
        // long horizontal rules/scratches that run across most of the recap.
        // Those near-edge-to-edge lines are form/scan artifacts, not opportunity
        // handwriting, even when a slightly crooked/thick scan makes them more
        // than a 1-3px hairline.
        if(area<10)continue;
        if(componentWidth<4||componentHeight<3)continue;
        if(density<0.06)continue;
        if(veryLongThin||nearFullWidthHorizontalLine)continue;

        totalValidInk+=area;
        largestValid=Math.max(largestValid,area);

        if(
          area>=48 &&
          componentWidth>=12 &&
          componentHeight>=8
        ){
          strongComponents++;
        }else if(
          area>=30 &&
          componentWidth>=8 &&
          componentHeight>=6
        ){
          mediumComponents++;
        }
      }

      // Any meaningful connected handwriting counts, whether black/gray or
      // colored. Keep only a small minimum cluster so stars, numbers, checks,
      // short notes, etc. are all detected.
      return(
        strongComponents>=1 ||
        mediumComponents>=1 ||
        totalValidInk>=48 ||
        largestValid>=30
      );
    }

    function syncOpportunityFlag(group){
      const flag=group?.ui?.opportunityFlag;
      if(!flag)return;

      const detected=Boolean(group.opportunityDetected);
      flag.classList.toggle("visible",detected);
      flag.setAttribute("aria-hidden",detected?"false":"true");
    }

    async function renderRecapClassificationCanvas(page){
      const base=page.getViewport({scale:1});
      const width=900;
      const viewport=page.getViewport({scale:width/base.width});
      const canvas=document.createElement("canvas");
      const ctx=canvas.getContext("2d",{willReadFrequently:true});
      canvas.width=width;
      canvas.height=Math.max(1,Math.round(viewport.height));
      await page.render({canvasContext:ctx,viewport}).promise;
      return canvas;
    }

    function recapCanvasHasMeaningfulInk(canvas){
      const ctx=canvas.getContext("2d",{willReadFrequently:true});
      const w=canvas.width,h=canvas.height,p=ctx.getImageData(0,0,w,h).data;
      let dark=0,veryDark=0;
      for(let y=Math.floor(h*.04);y<h*.96;y+=2){
        for(let x=Math.floor(w*.05);x<w*.95;x+=2){
          const i=(y*w+x)*4;
          const gray=(p[i]+p[i+1]+p[i+2])/3;
          if(gray<185)dark++;
          if(gray<115)veryDark++;
        }
      }
      return veryDark>=22||dark>=75;
    }

    async function recognizeRecapHeader(canvas){
      const header=document.createElement("canvas");
      const hh=Math.max(1,Math.floor(canvas.height*.28));
      header.width=canvas.width;
      header.height=hh;
      header.getContext("2d",{willReadFrequently:true})
        .drawImage(canvas,0,0,canvas.width,hh,0,0,header.width,header.height);
      const Tesseract=await ensureTesseract();
      const result=await Tesseract.recognize(header,"eng",{
        workerPath:"https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/worker.min.js",
        corePath:"https://unpkg.com/tesseract.js-core@5.1.1",
        langPath:"https://tessdata.projectnaptha.com/4.0.0",
        workerBlobURL:false,
        gzip:true
      });
      return clean(result?.data?.text||"");
    }

    function recapCanvasLooksLikeFront(canvas){
      const ctx=canvas.getContext("2d",{willReadFrequently:true});
      const w=canvas.width,h=canvas.height;
      const p=ctx.getImageData(0,0,w,h).data;

      let dark=0;
      let sampled=0;
      // Front forms have dense printed structure throughout most of the page;
      // a backside is mostly white with only handwriting.
      for(let y=Math.floor(h*.04);y<h*.93;y+=4){
        for(let x=Math.floor(w*.06);x<w*.94;x+=4){
          const i=(y*w+x)*4;
          const gray=(p[i]+p[i+1]+p[i+2])/3;
          sampled++;
          if(gray<175)dark++;
        }
      }
      const density=sampled?dark/sampled:0;
      return density>=0.038;
    }

    async function classifyRecapPage(pdf,pageNumber){
      const page=await pdf.getPage(pageNumber);
      try{
        const tc=await page.getTextContent();
        const embedded=clean((tc?.items||[]).map(item=>item.str||"").join(" "));
        if(/event\s*recap/i.test(embedded)&&/event\s*information/i.test(embedded)){
          return{pageNumber,isFront:true,hasContent:true,text:embedded};
        }
      }catch(_){}

      const canvas=await renderRecapClassificationCanvas(page);
      const hasContent=recapCanvasHasMeaningfulInk(canvas);
      const looksLikeFront=recapCanvasLooksLikeFront(canvas);
      let text="";
      try{text=await recognizeRecapHeader(canvas)}
      catch(error){console.warn("Recap header OCR failed for page "+pageNumber,error)}
      const normalized=text.toLowerCase().replace(/[^a-z0-9]+/g," ");
      const ocrFront=
        /event\s+recap/.test(normalized)&&
        /event\s+information/.test(normalized);

      return{
        pageNumber,
        isFront:ocrFront||looksLikeFront,
        hasContent,
        text
      };
    }

    async function processRecapPdf(file){
      if(!file||!currentGroups.length)return;
      if(file.type!=="application/pdf"&&!file.name.toLowerCase().endsWith(".pdf")){
        alert("Please upload the recap packet as a PDF.");
        return;
      }

      const oldText=recapUploadButton.textContent;
      recapUploadButton.disabled=true;
      recapUploadButton.textContent="Loading Recaps…";

      try{
        const bytes=new Uint8Array(await file.arrayBuffer());
        const recapPdf=await pdfjsLib.getDocument({data:bytes.slice()}).promise;
        currentRecapBytes=bytes.slice();
        currentRecapPdfJs=recapPdf;

        const recapSets=[];
        const classified=[];

        for(let pageNumber=1;pageNumber<=recapPdf.numPages;pageNumber++){
          recapUploadButton.textContent="Scanning Recaps "+pageNumber+"/"+recapPdf.numPages+"…";
          classified.push(await classifyRecapPage(recapPdf,pageNumber));
        }

        let current=null;

        for(const info of classified){
          if(info.isFront){
            // A real Event Recap/Event Information page always starts the next event.
            current={pages:[info.pageNumber],front:info.pageNumber};
            recapSets.push(current);
            continue;
          }

          if(!current){
            // Page 1 should normally be a front. If OCR misses it, keep it as
            // the first recap rather than discarding the packet.
            current={pages:[info.pageNumber],front:info.pageNumber};
            recapSets.push(current);
            continue;
          }

          // Anything with writing but WITHOUT the recap headings is the backside
          // / continuation of the recap immediately before it.
          if(info.hasContent){
            current.pages.push(info.pageNumber);
          }
        }

        const linked=Math.min(recapSets.length,currentGroups.length);
        let backSides=0;

        for(let index=0;index<currentGroups.length;index++){
          const group=currentGroups[index];
          const set=recapSets[index]||null;
          if(set){
            group.recapPdf=recapPdf;
            group.recapPageNumbers=set.pages.slice();
            group.recapPageNumber=set.pages[0]||null;
            backSides+=Math.max(0,set.pages.length-1);
            try{
              group.opportunityDetected=await detectOpportunityMark(recapPdf,set.front);
            }catch(error){
              console.warn("Opportunity scan failed for recap page "+set.front,error);
              group.opportunityDetected=false;
            }
          }else{
            group.recapPdf=null;
            group.recapPageNumbers=[];
            group.recapPageNumber=null;
            group.opportunityDetected=false;
          }
          syncOpportunityFlag(group);
        }

        const opportunities=currentGroups.filter(group=>
          Boolean(
            group?.opportunityDetected &&
            group?.ui?.opportunityFlag?.classList.contains("visible")
          )
        ).length;

        const recapSummary=
          linked+"/"+currentGroups.length+
          " event recaps scanned · "+
          opportunities+" opportunities detected.";

        recapUploadButton.title=recapSummary;
        await terminalMessage(
          recapSummary,
          linked===currentGroups.length?"success":"muted"
        );
      }catch(error){
        console.error("Recap PDF upload failed:",error);
        alert("Could not read that recap PDF. Please try again.");
      }finally{
        recapUploadButton.disabled=false;
        recapUploadButton.textContent=oldText||"Upload Recaps";
      }
    }

    function buildEventGroups(pageRecords){
      const groups=[];
      let current=null;
      let fallbackCounter=0;

      for(const record of pageRecords){
        const beoMatch=record.text.match(/\bBEO\s*#\s*:?\s*(\d+)/i);
        const beoNumber=beoMatch?beoMatch[1]:null;
        const hasEventHeader=/Event\s*Date\s*:/i.test(record.text);
        const hasMeaningfulText=record.text.trim().length>0;

        if(beoNumber){
          if(!current||current.beoNumber!==beoNumber){
            if(current&&current.records.length)groups.push(current);
            current={beoNumber,records:[],pageNumbers:[]};
          }
          current.records.push(record);
          current.pageNumbers.push(record.pageNumber-1);
          continue;
        }

        if(hasEventHeader&&(!current||current.records.length)){
          if(current&&current.records.length)groups.push(current);
          fallbackCounter++;
          current={beoNumber:"event-"+fallbackCounter,records:[record],pageNumbers:[record.pageNumber-1]};
          continue;
        }

        if(current&&hasMeaningfulText){
          current.records.push(record);
          current.pageNumbers.push(record.pageNumber-1);
        }
      }

      if(current&&current.records.length)groups.push(current);
      return groups;
    }

    async function buildTrimmedEventPdf(sourcePdf,pageNumbers){
      const unique=Array.from(new Set(pageNumbers)).filter(Number.isInteger);
      const out=await PDFDocument.create();
      const copied=await out.copyPages(sourcePdf,unique);
      copied.forEach(page=>out.addPage(page));
      return new Uint8Array(await out.save());
    }

    function parseEvent(group){
      const lines=group.records.flatMap(r=>r.lines);
      const text=group.records.map(r=>r.text).join("\n");
      const fullTitle=extractFullEventTitle(lines);
      const name=clean((fullTitle||"Event").split(" - ")[0]);
      const date=fieldValue(lines,"Event Date");
      const time=fieldValue(lines,"Event Time");
      const guests=fieldValue(lines,"Event Guest Count");
      const eventCard=extractEventCard(lines);
      const opportunityId=extractOpportunityId(lines,text);
      const tags=detectEventTags(lines,text);
      const financial=extractFinancials(lines,tags);

      return{name,fullTitle:fullTitle||name,date,time,guests,eventCard,opportunityId,beoNumber:group.beoNumber,tags,financial};
    }

    function extractOpportunityId(lines,text){
      const source=[...(lines||[]),String(text||"")].join("\n");
      const match=source.match(/Opportunity\s*ID\s*:\s*([A-Za-z0-9]{15,18})\b/i);
      return match?match[1]:null;
