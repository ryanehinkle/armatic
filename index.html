    function updateEnteredProgress(){
      const total=currentGroups.length;
      const checked=currentGroups.filter(group=>
        getEventEntered(group?.parsed?.eventCard,group?.parsed?.date)
      ).length;

      const progressWidth=total?((checked/total)*100)+"%":"0%";
      enteredProgressText.textContent=checked+"/"+total;
      enteredProgressBar.style.width=progressWidth;
      enteredProgressFloat.classList.toggle("visible",checked>0&&total>0);
      enteredProgressFloat.setAttribute("aria-hidden",checked>0&&total>0?"false":"true");
      enteredProgressBar.title=checked+" of "+total+" events entered";

      if(previewEnteredText)previewEnteredText.textContent=checked+"/"+total;
      if(previewEnteredBar)previewEnteredBar.style.width=progressWidth;
      if(previewEnteredBar)previewEnteredBar.title=checked+" of "+total+" events entered";
    }

    function extractFullEventTitle(lines){
      for(const line of lines){
        const m=line.match(/^(.*?)\s+Event\s*Date\s*:/i);
        if(m){
          const prefix=clean(m[1]);
          if(prefix&&!/^Page\s+\d+\s+of\s+\d+$/i.test(prefix))return prefix;
        }
      }

      for(const line of lines){
        if(/\s+-\s+/.test(line)&&!/:/.test(line)&&!/TOTAL|SUMMARY|BEO/i.test(line))return clean(line);
      }

      return null;
    }

    function fieldValue(lines,label){
      const escaped=esc(label);
      const allLabels="Event Date|Event Day of Week|Event Time|Event Status|Event Guest Count|Event Sales Manager|Event Manager|Account|Contact|Email|Phone|Golf Bays|Bay Validation|Catering Location|Booking Type";
      for(const line of lines){
        const m=line.match(new RegExp(escaped+"\\s*:\\s*(.*?)(?=\\s+(?:"+allLabels+")\\s*:|$)","i"));
        if(m){
          const value=clean(m[1]);
          if(value)return value;
        }
      }
      return null;
    }

    function extractEventCard(lines){
      for(const line of lines){
        const m=line.match(/EVENT\s*CARD\s*#?\s*\/\s*PARTY\s*ID\s*:\s*([A-Za-z0-9-]+)/i);
        if(m)return clean(m[1]);
      }
      return null;
    }

    function isZeroPlayItForwardEvent(lines,text){
      if(!/\bplay\s+it\s+forward\b/i.test(String(text||"")))return false;

      for(let i=0;i<lines.length;i++){
        const line=clean(lines[i]);
        if(!/\bplay\s+it\s+forward\b/i.test(line))continue;

        const nearby=clean(
          line+" "+(lines[i+1]||"")+" "+(lines[i+2]||"")
        );

        const amounts=(nearby.match(/USD\s*-?[\d,.]+/gi)||[])
          .map(parseMoney)
          .filter(value=>value!==null);

        if(
          amounts.length &&
          amounts.every(value=>Math.abs(Number(value)||0)<0.005)
        ){
          return true;
        }
      }

      return false;
    }

    function detectEventTags(lines,text){
      if(isZeroPlayItForwardEvent(lines,text)){
        return["Play It Forward"];
      }

      if(/\bfield\s*trip\b/i.test(text)){
        return["Field Trip"];
      }

      const tags=[];
      let section="";
      let foodItemCount=0;

      for(const rawLine of lines){
        const line=clean(rawLine);
        const sectionName=detectProductSection(line);

        if(sectionName){
          section=sectionName;
          continue;
        }

        if(section==="Food"){
          const foodItem=extractLineItem(line,"Food");
          if(foodItem&&!/\bTOTAL\b/i.test(line)){
            foodItemCount++;
          }
        }

        if(section!=="Food"&&section!=="Beverages")continue;

        if(/\byouth\b/i.test(line)&&!tags.includes("Youth"))tags.push("Youth");
        if(/\bcrowd\s+pleaser\b/i.test(line)&&!tags.includes("Pleaser"))tags.push("Pleaser");
        if(/\bshareable\s+bites?\b|\bfan\s+faves?\b/i.test(line)&&!tags.includes("Faves"))tags.push("Faves");
        if(/\bflex\b|\bmulti[- ]?bay\s+flex\b/i.test(line)&&!tags.includes("Flex"))tags.push("Flex");
        if(/\bbuffet\b/i.test(line)&&!tags.includes("Buffet"))tags.push("Buffet");
      }

      if(foodItemCount>=5&&!tags.includes("Buffet")){
        tags.push("Buffet");
      }

      const preferred=["Youth","Buffet","Flex","Pleaser","Faves"];
      tags.sort((a,b)=>preferred.indexOf(a)-preferred.indexOf(b));

      return tags.length?tags:["Other"];
    }

    function detectProductSection(line){
      const normalized=clean(line).toLowerCase();

      if(normalized==="food")return"Food";
      if(normalized==="beverages"||normalized==="beverage")return"Beverages";
      if(normalized==="gameplay"||normalized==="game play"||normalized==="game enhancement")return"Gameplay";
      if(normalized==="retail")return"Retail";
      if(normalized==="labor"||normalized==="labour")return"Labor";
      if(normalized==="asset"||normalized==="assets")return"Asset";
      if(normalized==="limited inventory"||normalized==="equipment rental"||normalized==="event equipment rental")return"Equipment Rental";
      if(normalized==="event space rental"||normalized==="space rental")return"Space Rental";
      if(normalized==="digital media"||normalized==="marketing partnerships")return"Digital Media";
      if(normalized==="charges & fees"||normalized==="charges and fees")return"Charges & Fees";
      if(normalized==="incentive"||normalized==="incentives")return"Incentives";

      return null;
    }

    function extractLineItem(line,section){
      const qtyPrice=line.match(/\b(\d+(?:\.\d+)?)\s+USD\s*(-?[\d,.]+)/i);
      if(!qtyPrice)return null;

      const amounts=line.match(/USD\s*-?[\d,.]+/gi)||[];
      const quantity=Number(qtyPrice[1]);
      const unitPrice=parseMoney(qtyPrice[2]);

      // One money value on a product row is just the unit price.
      // A true line total is only present when there is a second money value.
      const printedTotal=amounts.length>=2
        ? parseMoney(amounts[amounts.length-1])
        : null;

      if(!Number.isFinite(quantity)||unitPrice===null)return null;

      return{
        line,
        section,
        quantity,
        unitPrice,
        computedTotal:quantity*unitPrice,
        printedTotal
      };
    }

    function extractYouthFoodTotal(lines){
      let section="";
      let youthContext=0;
      let total=0;

      for(let i=0;i<lines.length;i++){
        const line=clean(lines[i]);
        const nextSection=detectProductSection(line);

        if(nextSection){
          section=nextSection;
          youthContext=0;
          continue;
        }

        if(section!=="Food"&&section!=="Beverages"){
          youthContext=0;
          continue;
        }

        if(/\byouth\b/i.test(line)){
          youthContext=3;
        }else if(youthContext>0){
          youthContext--;
        }

        if(youthContext<=0)continue;

        const firstUsdIndex=line.search(/USD\s*[\d,.]+/i);
        if(firstUsdIndex<0)continue;

        const unitMatch=line.slice(firstUsdIndex).match(/^USD\s*([\d,.]+)/i);
        if(!unitMatch)continue;

        const prefix=line.slice(0,firstUsdIndex);
        const numberMatches=[...prefix.matchAll(/(?:^|\s)(\d+(?:\.\d+)?)(?=\s|$)/g)];
        if(!numberMatches.length)continue;

        const quantity=Number(numberMatches[numberMatches.length-1][1]);
        const unitPrice=parseMoney(unitMatch[1]);

        if(!Number.isFinite(quantity)||unitPrice===null)continue;

        total+=quantity*unitPrice;
        youthContext=0;
      }

      return total;
    }

    function inferIncentiveTarget(text){
      return incentiveTargetFromText(text)||"Gameplay";
    }

    function incentiveTargetFromText(text){
      const x=String(text||"").toLowerCase();

      if(/\broom\s+rental\b|\bspace\s+rental\b/.test(x))return"Space Rental";
      if(/\bequipment\b|\blimited inventory\b/.test(x))return"Equipment Rental";
      if(/\bdigital\s+media\b|\bmarketing\b/.test(x))return"Digital Media";
      if(/\blabor\b|\blabour\b|\bstaff\b/.test(x))return"Labor";
      if(/\bretail\b|\bmerch/.test(x))return"Retail";
      if(/\bbeverage\b|\bbar\b|\bdrink\b|\balcohol\b/.test(x))return"Beverages";
      if(/\bfood\b|\bcatering\b/.test(x))return"Food";
      if(/\bgame\s*play\b|\bgameplay\b|\btopgolf\b|\bplay\b|\bgame\b/.test(x))return"Gameplay";

      return null;
    }

    function extractIncentiveRecords(lines){
      const records=[];
      let inIncentives=false;
      let pendingTarget=null;

      for(let i=0;i<lines.length;i++){
        const line=clean(lines[i]);

        if(!inIncentives){
          if(/^Incentives?$/i.test(line)){
            inIncentives=true;
          }
          continue;
        }

        if(
          /^(?:BILLING SUMMARY|PAYMENT SUMMARY|EVENT NOTES|IMPORTANT REMINDERS|INTERNAL NOTES)\b/i.test(line)
        ){
          break;
        }

        // The section total is only a reconciliation number.
        // It never belongs to a single contracted category.
        if(/\bIncentives?\s+TOTAL\b/i.test(line)){
          break;
        }

        const explicitTarget=incentiveTargetFromText(line);
        if(explicitTarget){
          pendingTarget=explicitTarget;
        }

        const negativeAmounts=[
          ...line.matchAll(/USD\s*-\s*([\d,.]+)/gi)
        ].map(match=>Math.abs(parseMoney(match[1])||0))
         .filter(amount=>amount>0.004);

        if(!negativeAmounts.length)continue;

        // The far-right / last negative USD value on this extracted row
        // is the incentive row TOTAL. Unit discounts can appear before it.
        const amount=negativeAmounts[negativeAmounts.length-1];
        const target=explicitTarget||pendingTarget;

        if(!target)continue;

        records.push({target,amount});
        pendingTarget=null;
      }

      return records;
    }

    function isEventNABeverageRow(text){
      return /\bevent\s+n\s*\/?\s*a(?:\s+(?:bev|beverage|beverages))?\b/i.test(String(text||""));
    }

    function isEventLBWRow(text){
      return /\bevent\s+(?:l\s*\/?\s*b\s*\/?\s*w|lbw)\b/i.test(String(text||""));
    }

    function isFlexMinimumText(text){
      const x=String(text||"");

      return(
        /\bf\s*&\s*b\s+minimum\b/i.test(x) ||
        /\bfood\s*&\s*beverage\s+minimum\b/i.test(x) ||
        /\bfood\s+and\s+beverage\s+minimum\b/i.test(x) ||
        /\bflex\b[^]{0,90}\bminimum\b/i.test(x) ||
        /\bminimum\b[^]{0,90}\bflex\b/i.test(x)
      );
    }

    function isFlexMinimumContextText(text){
      const x=String(text||"");

      return(
        /\bflex\b/i.test(x) &&
        (
          /\bf\s*&\s*b\b/i.test(x) ||
          /\bfood\s*&\s*beverage\b/i.test(x) ||
          /\bfood\s+and\s+beverage\b/i.test(x)
        )
      );
    }

    function extractFlexMinimumFromRawLines(lines){
      let section="";
      let total=0;
      const seen=new Set();

      for(let i=0;i<lines.length;i++){
        const line=clean(lines[i]);
        const nextSection=detectProductSection(line);

        if(nextSection){
          section=nextSection;
          continue;
        }

        if(section!=="Beverages"&&section!=="Food")continue;

        const currentHasMinimum=
          /\bminimum\b/i.test(line) ||
          isFlexMinimumText(line);
        const next=clean(lines[i+1]||"");
        const next2=clean(lines[i+2]||"");

        let candidate=line;

        if(currentHasMinimum){
          // Keep looking through nearby extracted text until the minimum's
          // positive contracted amount is found. This prevents a following
          // zero-dollar row (such as Individual Tabs) from masking it.
          const nearby=[next,next2,clean(lines[i+3]||"")];
          for(const extra of nearby){
            const positiveAmounts=(candidate.match(/USD\s*-?[\d,.]+/gi)||[])
              .map(parseMoney)
              .filter(value=>value!==null&&Math.abs(value)>0.004);

            if(positiveAmounts.length)break;
            if(!extra)continue;

            const extraSection=detectProductSection(extra);
            if(extraSection&&extraSection!==section)break;
            if(/\bTOTAL\s*:\s*USD\b/i.test(extra))break;

            candidate=clean(candidate+" "+extra);
          }
        }else{
          continue;
        }

        const amounts=(candidate.match(/USD\s*-?[\d,.]+/gi)||[])
          .map(parseMoney)
          .filter(value=>value!==null&&Math.abs(value)>0.004);

        if(!amounts.length)continue;

        const amount=Math.abs(amounts[amounts.length-1]);
        const key=i+"|"+amount.toFixed(2);

        if(seen.has(key))continue;
        seen.add(key);
        total+=amount;
      }

      return total;
    }

    function getFlexBeverageBuckets(lineItems,lines,tags){
      if(!tags.includes("Flex")){
        return null;
      }

      let minimum=0;
      let na=0;

      for(const item of lineItems){
        if(item.section!=="Beverages"&&item.section!=="Food")continue;

        const isMinimum=
          Boolean(item.isFlexMinimum) ||
          isFlexMinimumText(item.line) ||
          (tags.includes("Flex")&&isFlexMinimumContextText(item.line)) ||
          /\bminimum\b/i.test(item.line);

        const rowTotal=item.printedTotal!==null
          ? Math.max(0,Number(item.printedTotal)||0)
          : 0;

        if(isMinimum){
          minimum+=rowTotal;
          continue;
        }

        if(
          item.section==="Beverages" &&
          isExplicitFlexNABeverageRow(item.line)
        ){
          na+=rowTotal;
        }
      }

      const rawMinimum=extractFlexMinimumFromRawLines(lines);

      if(rawMinimum>0.004){
        minimum=rawMinimum;
      }

      return{minimum,na};
    }

    function isExplicitFlexNABeverageRow(text){
      const x=String(text||"");

      return(
        /\bevent\s+n\s*\/?\s*a\s+(?:bev|beverage|beverages)\b/i.test(x) ||
        /\b(?:n\s*\/?\s*a|na)\s+(?:bev|beverage|beverages)\b/i.test(x) ||
        /\bnon[- ]?alcoholic\b/i.test(x) ||
        /\bfountain\s+soft\s+drinks?\b/i.test(x) ||
        /\bsoft\s+drinks?\b/i.test(x) ||
        /\blemonade\b/i.test(x)
      );
    }

    function hasNABeverageText(text){
      return(
        /\bn\s*\/\s*a\b/i.test(text) ||
        /\bna\s+(?:bev|beverage|beverages)\b/i.test(text) ||
        /\bnon[- ]?alcoholic\b/i.test(text)
      );
    }

    function isCoachInstructionText(text){
      return /\bcoach\b|\binstruction\b|\binstructional\b/i.test(String(text||""));
    }

    function extractFinancials(lines,tags=[]){
      const categories={
        Food:0,
        Beverages:0,
        NA:0,
        Gameplay:0,
        Retail:0,
        Labor:0,
        "Equipment Rental":0,
        "Space Rental":0,
        "Digital Media":0,
        Coach:0,
        "Play It Forward":0,
        "F&B Minimum":0,
        "Other Fees":0
      };
      const detected={};
      const otherBreakdown=[];
      const lineItems=[];
      const incentiveRecords=extractIncentiveRecords(lines);
      let section="";
      let assetHasLeaderboard=false;
      let pendingMinimumContext="";
      let pendingMinimumLines=0;
      let voluntaryGratuity=0;
      let chargesFeesTotal=0;

      for(let lineIndex=0;lineIndex<lines.length;lineIndex++){
        const line=clean(lines[lineIndex]);
        const nextSection=detectProductSection(line);

        if(nextSection){
          section=nextSection;
          pendingMinimumContext="";
          pendingMinimumLines=0;
          if(section==="Asset")assetHasLeaderboard=false;
          continue;
        }

        if(section==="Asset"&&/\blive\s+leaderboard\b/i.test(line)){
          assetHasLeaderboard=true;
        }

        if(
          section==="Charges & Fees"&&
          /\bvoluntary\s+(?:gratuity|tip)\b/i.test(line)
        ){
          const gratuityItem=extractLineItem(line,section);

          if(gratuityItem){
            const gratuityAmount=
              gratuityItem.printedTotal!==null
                ? Math.max(0,Number(gratuityItem.printedTotal)||0)
                : Math.max(0,Number(gratuityItem.computedTotal)||0);

            voluntaryGratuity+=gratuityAmount;
          }
        }

        const totalMatch=line.match(/^(.+?)\s+TOTAL\s*:\s*USD\s*(-?[\d,.]+)/i);

        if(totalMatch){
          const rawLabel=clean(totalMatch[1]);
          const rawAmount=parseMoney(totalMatch[2]);

          if(rawAmount!==null){
            const amount=Math.abs(rawAmount);

            if(section==="Incentives"||/\bincentives?\b/i.test(rawLabel)){
              continue;
            }

            if(section==="Charges & Fees"){
              chargesFeesTotal=amount;
              continue;
            }

            let category;

            if(section==="Asset"&&assetHasLeaderboard){
              category="Gameplay";
            }else if(section==="Equipment Rental"){
              category="Equipment Rental";
            }else if(section==="Labor"){
              category="Labor";
            }else if(section==="Space Rental"){
              category="Space Rental";
            }else if(section==="Digital Media"){
              category="Digital Media";
            }else{
              category=mapRevenueCategory(rawLabel);
            }

            categories[category]=(categories[category]||0)+amount;
            detected[category]=true;

            if(category==="Other Fees"){
              otherBreakdown.push(rawLabel+" "+formatMoney(amount));
            }
          }

          continue;
        }

        if(section!=="Incentives"){
          const item=extractLineItem(line,section);
          const revenueSection=section==="Beverages"||section==="Food";

          if(item){
            if(revenueSection&&pendingMinimumContext){
              const combined=clean(pendingMinimumContext+" "+line);
              item.line=combined;

              if(
                isFlexMinimumText(combined) ||
                (tags.includes("Flex")&&/\bminimum\b/i.test(combined))
              ){
                item.isFlexMinimum=true;
              }

              pendingMinimumContext="";
              pendingMinimumLines=0;
            }else if(
              revenueSection&&
              (
                isFlexMinimumText(line) ||
                (tags.includes("Flex")&&/\bminimum\b/i.test(line)) ||
                (tags.includes("Flex")&&isFlexMinimumContextText(line))
              )
            ){
              // On some BEOs the product name wraps so the priced row ends with
              // "Food & Beverage" and the word "Minimum" is extracted on the
              // following line. The priced Flex F&B row itself is still the
              // contracted minimum (for example the $150 package).
              item.isFlexMinimum=true;
            }

            lineItems.push(item);
          }else if(
            revenueSection&&
            (
              isFlexMinimumText(line) ||
              isFlexMinimumContextText(line) ||
              (tags.includes("Flex")&&/\bminimum\b/i.test(line))
            )
          ){
            pendingMinimumContext=line;
            pendingMinimumLines=0;
          }else if(revenueSection&&pendingMinimumContext&&pendingMinimumLines<2){
            pendingMinimumContext=clean(pendingMinimumContext+" "+line);
            pendingMinimumLines++;
          }else if(pendingMinimumContext){
            pendingMinimumContext="";
            pendingMinimumLines=0;
          }
        }
      }

      for(const rawLine of lines){
        const line=clean(rawLine);
        const m=line.match(
          /^(Food|Beverages?|Gameplay|Game\\s*Enhancement|Retail|Labor|Limited\\s+Inventory|Equipment\\s+Rental|Event\\s+Space\\s+Rental|Space\\s+Rental|Digital\\s+Media)\\s+TOTAL\\s*:\\s*USD\\s*(-?[\\d,.]+)/i
        );

        if(!m)continue;

        const rawLabel=clean(m[1]);
        const amount=Math.abs(parseMoney(m[2])||0);
        const category=mapRevenueCategory(rawLabel);

        categories[category]=amount;
        detected[category]=true;
      }

      const contractedBeverageSplit={
        foundNA:false,
        foundLBW:false,
        na:0,
        lbw:0
      };

      for(const item of lineItems){
        if(item.section!=="Beverages")continue;

        const isMinimumRow=
          Boolean(item.isFlexMinimum) ||
          isFlexMinimumText(item.line) ||
          (tags.includes("Flex")&&/\bminimum\b/i.test(item.line));

        // Minimum always wins over N/A/LBW Toast item labels.
        if(isMinimumRow)continue;

        const isToastNA=
          tags.includes("Flex")
            ? isExplicitFlexNABeverageRow(item.line)
            : isEventNABeverageRow(item.line);
        const isToastLBW=isEventLBWRow(item.line);

        if(!isToastNA&&!isToastLBW)continue;

        // For these explicitly labeled Toast rows, only the far-right printed
        // row total is contracted revenue. A missing printed total means $0.
        const rowTotal=item.printedTotal!==null
          ? Math.max(0,Number(item.printedTotal)||0)
          : 0;

        if(isToastNA){
          contractedBeverageSplit.foundNA=true;
          contractedBeverageSplit.na+=rowTotal;
        }

        if(isToastLBW){
          contractedBeverageSplit.foundLBW=true;
          contractedBeverageSplit.lbw+=rowTotal;
        }
      }

      const splitFromParent={Food:0,Beverages:0};
      let youthFood=0;

      for(const item of lineItems){
        const parent=item.section==="Food"?"Food":item.section==="Beverages"?"Beverages":null;
        if(!parent)continue;

        const normalAmount=
          item.printedTotal!==null&&item.printedTotal>0
            ? item.printedTotal
            : item.computedTotal;

        const isYouth=/\byouth\b/i.test(item.line);
        const isMinimum=
          Boolean(item.isFlexMinimum) ||
          isFlexMinimumText(item.line) ||
          (tags.includes("Flex")&&/\bminimum\b/i.test(item.line));
        const isNA=!isMinimum&&hasNABeverageText(item.line);

        if(isYouth){
          youthFood+=item.computedTotal;
          if(item.printedTotal!==null&&item.printedTotal>0){
            splitFromParent[parent]+=item.printedTotal;
          }
          continue;
        }

        if(isMinimum){
          categories["F&B Minimum"]+=normalAmount;
          detected["F&B Minimum"]=true;

          if(item.printedTotal!==null&&item.printedTotal>0){
            splitFromParent[parent]+=item.printedTotal;
          }
          continue;
        }

        if(isNA){
          const naAmount=
            item.printedTotal!==null&&item.printedTotal>0
              ? item.printedTotal
              : 0;

          if(naAmount>0.004){
            categories.NA+=naAmount;
            detected.NA=true;
            splitFromParent[parent]+=naAmount;
          }
        }
      }

      if(tags.includes("Youth")){
        const robustYouthFood=extractYouthFoodTotal(lines);

        if(robustYouthFood>0){
          categories.Food=robustYouthFood;
          detected.Food=true;
          categories.Beverages=0;
          delete detected.Beverages;
          categories.NA=0;
          delete detected.NA;
        }else if(youthFood>0){
          categories.Food=youthFood;
          detected.Food=true;
        }
      }else if(youthFood>0){
        categories.Food+=youthFood;
        detected.Food=true;
      }

      for(const parent of ["Food","Beverages"]){
        if(tags.includes("Youth"))break;

        if(splitFromParent[parent]>0){
          categories[parent]=Math.max(0,categories[parent]-splitFromParent[parent]);

          if(categories[parent]<0.005){
            categories[parent]=0;
            delete detected[parent];
          }
        }
      }

      if(!tags.includes("Youth")){
        if(contractedBeverageSplit.foundNA){
          categories.NA=contractedBeverageSplit.na;

          if(categories.NA>0.004){
            detected.NA=true;
          }else{
            delete detected.NA;
          }
        }

        if(contractedBeverageSplit.foundLBW){
          categories.Beverages=contractedBeverageSplit.lbw;

          if(categories.Beverages>0.004){
            detected.Beverages=true;
          }else{
            delete detected.Beverages;
          }
        }
      }

      let coachTotal=0;

      for(const item of lineItems){
        if(item.section!=="Equipment Rental")continue;
        if(!isCoachInstructionText(item.line))continue;

        const amount=
          item.printedTotal!==null
            ? Math.max(0,Number(item.printedTotal)||0)
            : Math.max(0,Number(item.computedTotal)||0);

        coachTotal+=amount;
      }

      if(coachTotal>0.004){
        categories.Coach+=coachTotal;
        detected.Coach=true;

        categories["Equipment Rental"]=Math.max(
          0,
          Number(categories["Equipment Rental"]||0)-coachTotal
        );

        if(categories["Equipment Rental"]<0.005){
          categories["Equipment Rental"]=0;
          delete detected["Equipment Rental"];
        }
      }

      const flexBuckets=getFlexBeverageBuckets(lineItems,lines,tags);

      if(flexBuckets){
        categories["F&B Minimum"]=flexBuckets.minimum;
        categories.NA=flexBuckets.na;

        if(categories["F&B Minimum"]>0.004){
          detected["F&B Minimum"]=true;
        }else{
          delete detected["F&B Minimum"];
        }

        if(categories.NA>0.004){
          detected.NA=true;
        }else{
          delete detected.NA;
        }
      }

      const billingHeaderIndex=lines.findIndex(
        l=>/^\s*Subtotal\s+Taxes\s+Service Charge\s+Admin Fee\s+Total Charges\s*$/i.test(l)
      );
      let subtotal=null,taxes=null,serviceCharge=null,adminFee=null,totalCharges=null;

      if(billingHeaderIndex>=0&&lines[billingHeaderIndex+1]){
        const amounts=(lines[billingHeaderIndex+1].match(/USD\s*-?[\d,.]+/gi)||[]).map(parseMoney);
        subtotal=amounts[0]??null;
        taxes=amounts[1]??null;
        serviceCharge=amounts[2]??null;
        adminFee=amounts[3]??null;
        totalCharges=amounts[4]??null;
      }

      if(chargesFeesTotal>0.004){
        // The Charges & Fees section total can include the contracted voluntary
        // gratuity PLUS the Billing Summary's Service Charge/Admin Fee. Those
        // billing charges are already tracked separately and must not become an
        // extra "Other Fees" contracted bucket (which would inflate subtotal/AR).
        const knownBillingCharges=
          Math.max(0,Number(serviceCharge||0))+
          Math.max(0,Number(adminFee||0));
        const remainingCharges=Math.max(
          0,
          chargesFeesTotal-voluntaryGratuity-knownBillingCharges
        );

        if(remainingCharges>0.004){
          categories["Other Fees"]+=remainingCharges;
          detected["Other Fees"]=true;
          otherBreakdown.push("Charges & Fees "+formatMoney(remainingCharges));
        }
      }

      if(tags.includes("Play It Forward")){
        categories["Play It Forward"]=0;
        detected["Play It Forward"]=true;
      }

      const originalCategories={...categories};
      const incentiveAdjustments={};

      for(const incentive of incentiveRecords){
        const target=incentive.target||"Gameplay";
        const amount=Math.abs(Number(incentive.amount||0));
        if(amount<0.005)continue;

        const current=Number(categories[target]||0);
        if(current<=0)continue;

        incentiveAdjustments[target]=(incentiveAdjustments[target]||0)+amount;
        categories[target]=Math.max(0,current-amount);
        detected[target]=true;
      }

      if(voluntaryGratuity>0.004){
        const existingServiceCharge=Number(serviceCharge||0);
        const baseTotal=
          Number(subtotal||0)+
          Number(taxes||0)+
          Number(adminFee||0)+
          existingServiceCharge;

        const gratuityExplainsTotal=
          totalCharges!==null&&
          Math.abs(
            Number(totalCharges)-baseTotal-voluntaryGratuity
          )<=0.03;

        if(existingServiceCharge<0.005||gratuityExplainsTotal){
          serviceCharge=existingServiceCharge+voluntaryGratuity;
        }
      }

      let payments=null,outstanding=null;

      for(const line of lines){
        let m=line.match(/^Total Payments\s+USD\s*(-?[\d,.]+)/i);
        if(m)payments=parseMoney(m[1]);

        m=line.match(/^Total Outstanding Balance\s+USD\s*(-?[\d,.]+)/i);
        if(m)outstanding=parseMoney(m[1]);
      }

      return{
        categories,
        originalCategories,
        incentiveAdjustments,
        detected,
        otherBreakdown,
        subtotal,
        taxes,
        serviceCharge,
        adminFee,
        totalCharges,
        payments,
        outstanding
      };
    }

    function mapRevenueCategory(label){
      const x=label.toLowerCase().replace(/[^a-z0-9]+/g," ").trim();

      if(/\bnon alcoholic\b|\bna beverage\b|\bna beverages\b/.test(x))return"NA";
      if(/\bequipment rental\b|\blimited inventory\b/.test(x))return"Equipment Rental";
      if(/\bevent space rental\b|\bspace rental\b/.test(x))return"Space Rental";
      if(/\bdigital media\b|\bmarketing partnerships?\b/.test(x))return"Digital Media";
      if(/\bfood\b/.test(x)&&!/\bbeverages?\b/.test(x))return"Food";
      if(/\bbeverages?\b|\bbar\b|\balcohol\b/.test(x))return"Beverages";
      if(/\bgame ?play\b|\bgame enhancement\b|\bgame\b/.test(x))return"Gameplay";
      if(/\bretail\b|\bmerch/.test(x))return"Retail";
      if(/\blabor\b|\blabour\b|\bstaff\b/.test(x))return"Labor";
      return"Other Fees";
    }

    async function readPdfRecords(pdf){
      const records=[];

      for(let n=1;n<=pdf.numPages;n++){
        const page=await pdf.getPage(n);
        const lines=await extractLines(page);
        records.push({
          pageNumber:n,
          lines,
          text:lines.join("\n")
        });
      }

      return records;
    }

    async function replaceEventPdf(group,file){
      if(!file)return;
      if(
        file.type!=="application/pdf" &&
        !file.name.toLowerCase().endsWith(".pdf")
      ){
        return;
      }

      try{
        const rawBytes=new Uint8Array(await file.arrayBuffer());
        const sourcePdf=await pdfjsLib.getDocument({
          data:rawBytes.slice()
        }).promise;

        const records=await readPdfRecords(sourcePdf);

        const previousCard=group.cardElement;
        const previousToast=group.toastData||null;

        group.records=records;
        group.pageNumbers=records.map((_,index)=>index);
        group.pdfBytes=rawBytes;
        group.pdf=sourcePdf;
        group.replacedPdf=true;

        const beoMatch=records
          .map(record=>record.text)
          .join("\n")
          .match(/\bBEO\s*#\s*:?\s*(\d+)/i);

        if(beoMatch){
          group.beoNumber=beoMatch[1];
        }

        group.parsed=parseEvent(group);

        let toastData=previousToast;
        const csvRows=currentToastByEvent.get(
          String(group.parsed.eventCard||"").trim()
        );

        if(csvRows?.length){
          toastData=makeToastDataFromCsvRows(csvRows);
        }

        if(group.parsed.tags.includes("Play It Forward")){
          const zeroComparison=makeZeroPlayItForwardComparison();
          group.toastData=null;
          group.parsed.arProcessed=true;
          group.parsed.arComparison=zeroComparison;
          group.arComparison=zeroComparison;
        }else if(toastData){
          const comparison=compareAdditionalRevenue(
            toastData,
            group.parsed.financial,
            group.parsed
          );

          group.toastData=toastData;
          group.parsed.arProcessed=true;
          group.parsed.arComparison=comparison;
          group.arComparison=comparison;
        }else{
          group.toastData=null;
          group.parsed.arProcessed=false;
          group.parsed.arComparison=null;
          group.arComparison=null;
        }

        const index=currentGroups.indexOf(group);
        const newCard=await renderEventCard(
          group,
          index>=0?index+1:1,
          currentGroups.length
        );

        if(previousCard&&previousCard.isConnected){
          previousCard.replaceWith(newCard);
        }

        if(group.toastData&&group.ui){
          group.ui.contracted.open=false;
        }else if(
          currentToastByEvent.size>0 &&
          !group.parsed.tags.includes("Play It Forward")
        ){
          showNoToastData(group);
        }

        // After replacing an event PDF, keep the Toast paste action compact
        // like the other completed cards instead of showing the large paste box.
        if(
          group.ui &&
          !group.parsed.tags.includes("Play It Forward")
        ){
          group.ui.pasteZone.style.display="none";
          group.ui.replaceButton.classList.add("visible");
        }

        updateEventsProgress();
        updatePortfolioSales();
      }catch(error){
        console.error("Event PDF replacement failed:",error);
      }
    }

    function deleteEvent(group){
      const index=currentGroups.indexOf(group);

      if(index<0)return;

      currentGroups.splice(index,1);

      if(group.cardElement&&group.cardElement.isConnected){
        group.cardElement.remove();
      }

      eventCount.textContent=
        currentGroups.length+
        (currentGroups.length===1?" event":" events");

      exportButton.disabled=currentGroups.length===0;
      updateEventsProgress();
      updatePortfolioSales();
      refreshAddEventSlot();
    }

    async function addIndividualEventPdf(file){
      if(!file)return;
      if(
        file.type!=="application/pdf" &&
        !file.name.toLowerCase().endsWith(".pdf")
      ){
        return;
      }

      try{
        const rawBytes=new Uint8Array(await file.arrayBuffer());
        const rawPdf=await pdfjsLib.getDocument({
          data:rawBytes.slice()
        }).promise;

        const records=await readPdfRecords(rawPdf);

        if(!records.length){
          return;
        }

        const joinedText=records.map(record=>record.text).join("\n");
        const beoMatch=joinedText.match(/\bBEO\s*#\s*:?\s*(\d+)/i);

        const group={
          beoNumber:beoMatch?beoMatch[1]:"added-"+Date.now(),
          records,
          pageNumbers:records.map((_,index)=>index),
          pdfBytes:rawBytes,
          pdf:rawPdf,
          addedPdf:true
        };

        group.parsed=parseEvent(group);

        if(group.parsed.tags.includes("Play It Forward")){
          const zeroComparison=makeZeroPlayItForwardComparison();
          group.parsed.arProcessed=true;
          group.parsed.arComparison=zeroComparison;
          group.arComparison=zeroComparison;
        }else{
          const csvRows=currentToastByEvent.get(
            String(group.parsed.eventCard||"").trim()
          );

          if(csvRows?.length){
            const toast=makeToastDataFromCsvRows(csvRows);
            const comparison=compareAdditionalRevenue(
              toast,
              group.parsed.financial,
              group.parsed
            );

            group.toastData=toast;
            group.parsed.arProcessed=true;
            group.parsed.arComparison=comparison;
            group.arComparison=comparison;
          }else{
            group.parsed.arProcessed=false;
            group.parsed.arComparison=null;
            group.arComparison=null;
          }
        }

        currentGroups.push(group);

        const card=await renderEventCard(
          group,
          currentGroups.length,
          currentGroups.length
        );

        const slot=eventsGrid.querySelector(".add-event-slot");

        if(slot){
          slot.before(card);
        }else{
          eventsGrid.appendChild(card);
        }

        if(group.toastData&&group.ui){
          group.ui.contracted.open=false;
        }else if(
          currentToastByEvent.size>0 &&
          !group.parsed.tags.includes("Play It Forward")
        ){
          showNoToastData(group);
        }

        eventCount.textContent=
          currentGroups.length+
          (currentGroups.length===1?" event":" events");

        updateEventsProgress();
        updatePortfolioSales();
        refreshAddEventSlot();
      }catch(error){
        console.error("Add event PDF failed:",error);
      }
    }

    function parseCsvText(text){
      const rows=[];
      let row=[];
      let field="";
      let quoted=false;
      const source=String(text||"");

      for(let i=0;i<source.length;i++){
        const ch=source[i];

        if(quoted){
          if(ch==='"'&&source[i+1]==='"'){
            field+='"';
            i++;
          }else if(ch==='"'){
            quoted=false;
          }else{
            field+=ch;
          }
          continue;
        }

        if(ch==='"'){
          quoted=true;
        }else if(ch===","){
          row.push(field);
          field="";
        }else if(ch==="\n"){
          row.push(field.replace(/\r$/,""));
          rows.push(row);
          row=[];
          field="";
        }else{
          field+=ch;
        }
      }

      if(field.length||row.length){
        row.push(field.replace(/\r$/,""));
        rows.push(row);
      }

      return rows.filter(row=>row.some(cell=>String(cell||"").trim()!==""));
    }

    function csvNumber(value){
      const cleaned=String(value??"")
        .trim()
        .replace(/[$,]/g,"")
        .replace(/^\((.*)\)$/,"-$1");

      const number=Number(cleaned);
      return Number.isFinite(number)?number:0;
    }

    function toastCsvEventCard(server){
      const match=String(server||"").trim().match(/^Event\s+(\d+)\s+Card$/i);
      if(!match)return null;

      const number=Number(match[1]);
      if(!Number.isFinite(number))return null;

      return String(number<1000?1000+number:number);
    }

    function isToastVoluntaryTipCategory(category){
      const compact=String(category||"")
        .toLowerCase()
        .normalize("NFKD")
        .replace(/[^a-z0-9]+/g,"");

      return(
        compact==="voluntarytip" ||
        compact==="voluntarygratuity" ||
        compact==="gratuity"
      );
    }

    function mapToastCsvCategory(category){
      const x=String(category||"")
        .toLowerCase()
        .replace(/[–—]/g,"-")
        .replace(/\s+/g," ")
        .trim();

      if(x==="beer"||x==="liquor"||x==="wine")return"LBW";
      if(x==="n/a bev"||x==="na bev"||x==="non-alcoholic"||x==="non alcoholic")return"NA";
      if(x==="food")return"Food";
      if(x==="game play"||x==="gameplay")return"Gameplay";
      if(x==="event drink package"||x==="drink package"||x==="beverage package")return"Beverages";
      if(x==="admin fee")return"Admin Fee";
      if(x==="service charge")return"Service Charge";
      if(isToastVoluntaryTipCategory(category))return"Voluntary Tip";
      if(x==="event - space rental"||x==="event space rental"||x==="space rental")return"Space Rental";
      if(x==="event - equipment rental"||x==="event equipment rental"||x==="equipment rental")return"Equipment Rental";
      if(x==="event - labor"||x==="event labor"||x==="labor"||x==="labour")return"Labor";
      if(x==="marketing partnerships"||x==="marketing partnership"||x==="digital media")return"Digital Media";
      if(
        /^events?\s*-\s*fees?$/.test(x) ||
        x==="events fees" ||
        x==="event fees" ||
        x==="fees" ||
        x==="fee"
      )return"Fees";
      if(x==="retail")return"Retail";
      if(x==="coach"||x==="instruction"||x==="instructional")return"Coach";
      if(x==="club rental")return"Other Fees";

      return"Other Fees";
    }

    function makeToastDataFromCsvRows(rows){
      const totals={
        Food:0,
        Beverages:0,
        LBW:0,
        NA:0,
        Gameplay:0,
        Retail:0,
        Labor:0,
        "Equipment Rental":0,
        "Space Rental":0,
        "Digital Media":0,
        Coach:0,
        Fees:0,
        "Other Fees":0,
        "Voluntary Tip":0,
        "Service Charge":0,
        "Admin Fee":0
      };
      const recognized=new Set();
      let totalNetSales=0;

      for(const row of rows){
        const net=csvNumber(row.netSales);
        totalNetSales+=net;

        const mapped=mapToastCsvCategory(row.category);
        if(!mapped)continue;

        totals[mapped]=(totals[mapped]||0)+net;
        recognized.add(mapped);

      }

      totals.__recognized=recognized;
      totals.__totalNetSales=totalNetSales;
      totals.__source="csv";
      return totals;
    }

    async function processToastCsv(file){
      if(!currentGroups.length)return;

      const oldText=toastUploadButton.textContent;
      toastUploadButton.disabled=true;
      toastUploadButton.textContent="Reading…";

      try{
        const text=await file.text();
        const rows=parseCsvText(text);

        if(rows.length<2){
          throw new Error("Toast CSV is empty");
        }

        const headers=rows[0].map(value=>String(value||"").trim().toLowerCase());
        const indexOfHeader=(...names)=>{
          for(const name of names){
            const index=headers.indexOf(name.toLowerCase());
            if(index>=0)return index;
          }
          return-1;
        };

        const categoryIndex=indexOfHeader("Sales Category");
        const serverIndex=indexOfHeader("Server");
        const netIndex=indexOfHeader("Net Sales");

        if(categoryIndex<0||serverIndex<0||netIndex<0){
          throw new Error("Toast CSV needs Sales Category, Server, and Net Sales columns");
        }

        const byEvent=new Map();
        let ignoredRows=0;
        let eventRows=0;
        let hasGameUserChecks=false;

        for(let i=1;i<rows.length;i++){
          const row=rows[i];
          const server=String(row[serverIndex]||"").trim();
          if(/^Game User$/i.test(server))hasGameUserChecks=true;
          const eventCard=toastCsvEventCard(server);

          if(!eventCard){
            ignoredRows++;
            continue;
          }

          eventRows++;

          if(!byEvent.has(eventCard)){
            byEvent.set(eventCard,[]);
          }

          byEvent.get(eventCard).push({
            category:row[categoryIndex],
            netSales:row[netIndex]
          });
        }

        currentToastByEvent=byEvent;
        gameUserChecksDetected=hasGameUserChecks;
        syncGameUserFlag();

        let matched=0;

        for(const group of currentGroups){
          const parsed=group.parsed;
          const card=String(parsed?.eventCard||"").trim();
          const eventSales=byEvent.get(card);

          if(!eventSales?.length){
            if(parsed?.tags?.includes("Play It Forward")){
              // Known $0 Play It Forward events are valid without Toast rows.
              if(parsed.arComparison){
                renderAdditionalRevenue(group.ui.arResults,parsed.arComparison);
                updateSubtotalCheck(group.ui.subtotalCheck,parsed.arComparison);
              }
            }else{
              showNoToastData(group);
            }
            continue;
          }

          const toast=makeToastDataFromCsvRows(eventSales);
          const comparison=compareAdditionalRevenue(
            toast,
            parsed.financial,
            parsed
          );

          group.toastData=toast;
          parsed.arProcessed=true;
          parsed.arComparison=comparison;
          group.arComparison=comparison;

          const ui=group.ui;

          if(ui){
            renderAdditionalRevenue(ui.arResults,comparison);
            updateSubtotalCheck(ui.subtotalCheck,comparison);
            await refreshEventPdfPreview(group);

            ui.contracted.open=false;
            ui.scanLog.replaceChildren();
            ui.scanLog.classList.remove("visible");
            ui.pasteZone.classList.remove("processing");
            ui.pasteZone.style.display="none";
            ui.replaceButton.classList.add("visible");
          }

          matched++;
        }

        updateEventsProgress();
        updatePortfolioSales();

        toastUploadButton.title=
          file.name+" · "+matched+" matched event"+(matched===1?"":"s");

        await terminalMessage(
          "Toast CSV matched "+matched+" of "+currentGroups.length+" BEO events.",
          matched?"success":"muted"
        );

        if(!matched){
          alert("No Toast Event ## Card servers matched the BEO event cards in this PDF.");
        }
      }catch(error){
        console.error("Toast CSV import failed:",error);
        alert(error?.message||"Could not read that Toast CSV.");
      }finally{
        toastUploadButton.disabled=false;
        toastUploadButton.textContent=oldText;
      }
    }

    async function handleToastPaste(event,group,parsed,financial,contracted,subtotalCheck,pasteZone,replaceButton,scanLog,results){
      const items=Array.from(event.clipboardData?.items||[]);
      const imageItem=items.find(item=>item.type&&item.type.startsWith("image/"));
      if(!imageItem)return;

      event.preventDefault();
      const blob=imageItem.getAsFile();
      if(!blob)return;

      pasteZone.classList.add("processing");
      pasteZone.style.display="none";
      replaceButton.classList.add("visible");
      results.replaceChildren();
      scanLog.replaceChildren();
      scanLog.classList.add("visible");

      try{
        await arType(scanLog,"Reading Toast sales summary…");

        const prepared=await prepareToastImage(blob);
        const text=await recognizeToastImage(prepared,scanLog);

        await arType(scanLog,"Matching Toast categories to contract…");

        const toast=parseToastSales(text);
        const comparison=compareAdditionalRevenue(toast,financial,parsed);
        group.toastData=toast;

        await arType(
          scanLog,
          comparison.items.length
            ? "Additional revenue found."
            : "No additional revenue found."
        );

        if(comparison.recognizedCount===0){
          throw new Error("No Toast rows passed currency validation");
        }

        parsed.arProcessed=true;
        parsed.arComparison=comparison;
        group.arComparison=comparison;

        renderAdditionalRevenue(results,comparison);
        updateSubtotalCheck(subtotalCheck,comparison);
        await refreshEventPdfPreview(group);
        updateEventsProgress();
        updatePortfolioSales();

        if(contracted){
          contracted.open=false;
        }

        setTimeout(()=>{
          scanLog.classList.remove("visible");
        },450);
      }catch(error){
        console.error("Toast screenshot OCR failed:",error);
        scanLog.textContent="Toast screenshot reader hit an error. Please paste the same screenshot again.";
        pasteZone.style.display="";
        pasteZone.classList.remove("processing");
      }
    }

    async function prepareToastImage(blob){
      const bitmap=await createImageBitmap(blob);

      const targetWidth=Math.min(2600,Math.max(1400,bitmap.width*3));
      const scale=targetWidth/bitmap.width;
      const canvas=document.createElement("canvas");
      canvas.width=Math.round(bitmap.width*scale);
      canvas.height=Math.round(bitmap.height*scale);

      const ctx=canvas.getContext("2d",{willReadFrequently:true});
      ctx.fillStyle="#ffffff";
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.imageSmoothingEnabled=true;
      ctx.imageSmoothingQuality="high";
      ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);
      bitmap.close();

      // Toast screenshots are clean UI captures. Converting to high-contrast
      // grayscale makes the table text much easier for OCR to read reliably.
      const image=ctx.getImageData(0,0,canvas.width,canvas.height);
      const data=image.data;

      for(let i=0;i<data.length;i+=4){
        const gray=Math.round(data[i]*0.299+data[i+1]*0.587+data[i+2]*0.114);
        const adjusted=gray>228?255:gray<95?0:Math.max(0,Math.min(255,(gray-95)*1.9));
        data[i]=adjusted;
        data[i+1]=adjusted;
        data[i+2]=adjusted;
        data[i+3]=255;
      }

      ctx.putImageData(image,0,0);
      return canvas;
    }

    async function ensureTesseract(){
      if(window.Tesseract)return window.Tesseract;

      const sources=[
        "https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js",
        "https://unpkg.com/tesseract.js@5.1.1/dist/tesseract.min.js"
      ];

      let lastError=null;

      for(const src of sources){
        try{
          await new Promise((resolve,reject)=>{
            const existing=document.querySelector('script[data-tesseract-source="'+src+'"]');

            if(existing){
              if(window.Tesseract){
                resolve();
                return;
              }

              existing.addEventListener("load",resolve,{once:true});
              existing.addEventListener("error",reject,{once:true});
              return;
            }

            const script=document.createElement("script");
            script.src=src;
            script.async=true;
            script.dataset.tesseractSource=src;
            script.onload=resolve;
            script.onerror=()=>reject(new Error("Failed to load "+src));
            document.head.appendChild(script);
          });

          if(window.Tesseract)return window.Tesseract;
        }catch(error){
          lastError=error;
          console.warn("Tesseract source failed:",src,error);
        }
      }

      throw lastError||new Error("Tesseract did not load");
    }

    async function recognizeToastImage(canvas,scanLog){
      const Tesseract=await ensureTesseract();

      const logger=(message)=>{
        if(message.status==="recognizing text"&&Number.isFinite(message.progress)){
          const percent=Math.round(message.progress*100);
          scanLog.textContent="Reading Toast sales summary… "+percent+"%";
        }
      };

      let worker=null;

      try{
        worker=await Tesseract.createWorker("eng",1,{
          logger,
          workerPath:"https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/worker.min.js",
          corePath:"https://unpkg.com/tesseract.js-core@5.1.1",
          langPath:"https://tessdata.projectnaptha.com/4.0.0"
        });

        await worker.setParameters({
          preserve_interword_spaces:"1",
          tessedit_pageseg_mode:"6"
        });

        const result=await worker.recognize(canvas);
        return result?.data?.text||"";
      }catch(primaryError){
        console.warn("Primary OCR worker failed; trying fallback OCR.",primaryError);

        try{
          const fallback=await Tesseract.recognize(canvas,"eng",{
            logger,
            workerPath:"https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/worker.min.js",
            corePath:"https://unpkg.com/tesseract.js-core@5.1.1",
            langPath:"https://tessdata.projectnaptha.com/4.0.0"
          });

          return fallback?.data?.text||"";
        }catch(fallbackError){
          console.error("Fallback OCR also failed.",fallbackError);
          throw fallbackError;
        }
      }finally{
        if(worker){
          try{await worker.terminate()}catch(_){}
        }
      }
    }

    function extractToastLBW(source,flat){
      const alcohol={Beer:null,Liquor:null,Wine:null};
      const rows=String(source||"").split(/\r?\n/).map(clean).filter(Boolean);

      for(const label of Object.keys(alcohol)){
        // First choice: find the actual OCR row, allowing harmless leading OCR noise.
        for(let i=0;i<rows.length;i++){
          if(!new RegExp("\\b"+label+"\\b","i").test(rows[i]))continue;

          const candidates=[
            rows[i],
            clean(rows[i]+" "+(rows[i+1]||"")),
            clean((rows[i-1]||"")+" "+rows[i]+" "+(rows[i+1]||""))
          ];

          for(const candidate of candidates){
            const amounts=extractToastAmounts(candidate);
            if(amounts.length){
              alcohol[label]=amounts[0];
              break;
            }
          }

          if(alcohol[label]!==null)break;
        }

        if(alcohol[label]!==null)continue;

        // Fallback for OCR that flattened the visual row structure.
        // Start exactly at this category label and inspect only a short window
        // after it, so Beer/Liquor/Wine cannot steal values from one another.
        const re=new RegExp("\\b"+label+"\\b","i");
        const match=re.exec(flat);

        if(match){
          const segment=flat.slice(match.index,Math.min(flat.length,match.index+180));
          const amounts=extractToastAmounts(segment);

          if(amounts.length){
            alcohol[label]=amounts[0];
          }
        }
      }

      const found=Object.values(alcohol).filter(value=>value!==null);

      return{
        values:alcohol,
        count:found.length,
        total:found.reduce((sum,value)=>sum+value,0)
      };
    }

    function hasAllAlcoholLabels(text){
      const x=String(text||"").toLowerCase();

      const hasBeer=/\bbe[e3]r\b/i.test(x);
      const hasLiquor=/\bl[i1]qu[o0]r\b/i.test(x);
      const hasWine=/\bw[i1l]ne\b/i.test(x);

      return hasBeer&&hasLiquor&&hasWine;
    }

    function parseToastSales(text){
      const totals={
        Food:0,
        Beverages:0,
        LBW:0,
        NA:0,
        Gameplay:0,
        Retail:0,
        Labor:0,
        "Equipment Rental":0,
        "Space Rental":0,
        "Digital Media":0,
        Fees:0,
        "Other Fees":0,
        "Voluntary Tip":0,
        "Service Charge":0,
        "Admin Fee":0
      };
      const recognized=new Set();

      const source=String(text||"");
      const flat=source
        .replace(/[|]/g," ")
        .replace(/\s+/g," ")
        .trim();

      const categories=[
        {label:"Food",patterns:[/\bFood\b/i]},
        {label:"Beverages",patterns:[/\bEvent\s+Drink\s+Package\b/i,/\bDrink\s+Package\b/i,/\bBeverage\s+Package\b/i]},
        {label:"Gameplay",patterns:[/\bGame\s*Play\b/i,/\bGameplay\b/i]},
        {label:"Equipment Rental",patterns:[/\bEvent\s*[-–—]?\s*Equipment\s+Rental\b/i,/\bEquipment\s+Rental\b/i]},
        {label:"Space Rental",patterns:[/\bEvent\s*[-–—]?\s*Space\s+Rental\b/i,/\bSpace\s+Rental\b/i]},
        {label:"Digital Media",patterns:[/\bMarketing\s+Partnerships?\b/i,/\bDigital\s+Media\b/i]},
        {label:"Admin Fee",patterns:[/\bAdmin\s+Fee\b/i]},
        {label:"Service Charge",patterns:[/\bService\s+Charge\b/i]},
        {label:"Voluntary Tip",patterns:[/\bVoluntary\s*Tip\b/i,/\bVoluntary\s+Gratuity\b/i,/\bGratuity\b/i]},
        {label:"Fees",patterns:[/\bEvents?\s*[-–—]?\s*Fees?\b/i,/(?<!Admin )\bFees?\b/i]},
        {label:"NA",patterns:[/\bN\s*\/?\s*A\s*Bev\b/i,/\bNA\s*Bev\b/i,/\bNon[- ]?Alcoholic\b/i]},
        {label:"Retail",patterns:[/\bRetail\b/i]},
        {label:"Labor",patterns:[/\bEvent\s*[-–—]?\s*Labou?r\b/i,/\bLabou?r\b/i]},
        {label:"Beer",patterns:[/\bBeer\b/i]},
        {label:"Liquor",patterns:[/\bLiquor\b/i]},
        {label:"Wine",patterns:[/\bWine\b/i]},
        {label:"Coach",patterns:[/\bCoach\b/i]}
      ];

      const hits=[];

      for(const category of categories){
        let best=null;

        for(const pattern of category.patterns){
          const match=pattern.exec(flat);
          if(match&&(!best||match.index<best.index)){
            best={index:match.index,length:match[0].length};
          }
        }

        if(best)hits.push({...category,...best});
      }

      hits.sort((a,b)=>a.index-b.index);

      for(let i=0;i<hits.length;i++){
        const hit=hits[i];
        const next=hits[i+1];
        const end=next?next.index:Math.min(flat.length,hit.index+240);
        const segment=flat.slice(hit.index+hit.length,end);

        const amounts=extractToastAmounts(segment);
        if(!amounts.length)continue;

        const netSales=amounts[0];
        if(netSales===null)continue;

        if(hit.label==="Beer"||hit.label==="Liquor"||hit.label==="Wine"){
          totals.LBW+=netSales;
          recognized.add("LBW");
        }else if(hit.label==="Coach"){
          totals.Coach+=netSales;
          recognized.add("Coach");
        }else{
          totals[hit.label]+=netSales;
          recognized.add(hit.label);
        }
      }

      // Fallback for OCR engines that preserve each table row cleanly.
      const rows=source.split(/\r?\n/).map(clean).filter(Boolean);
      let totalNetSales=null;

      for(const row of rows){
        if(/^tota(?:l|1|!)(?:\s|$)/i.test(row)){
          const totalAmounts=extractToastAmounts(row);
          if(totalAmounts.length){
            totalNetSales=totalAmounts[0];
          }
          continue;
        }
        const category=mapToastCategory(row);
        if(!category)continue;

        const amounts=extractToastAmounts(row);
        if(!amounts.length)continue;

        if(category==="LBW"){
          // Beer/Liquor/Wine are handled together by extractToastLBW below.
          continue;
        }

        // Only fill other categories not already recovered from the flattened table.
        if(Math.abs(totals[category]||0)<0.005){
          totals[category]+=amounts[0];
        }
        recognized.add(category);
      }

      const lbw=extractToastLBW(source,flat);

      if(lbw.count>0){
        totals.LBW=lbw.total;
        recognized.add("LBW");
      }

      if(totalNetSales===null){
        const totalMatch=flat.match(/\btota(?:l|1|!)\s+\d+\s+(.{0,120})$/i);
        if(totalMatch){
          const totalAmounts=extractToastAmounts(totalMatch[1]);
          if(totalAmounts.length){
            totalNetSales=totalAmounts[0];
          }
        }
      }

      // When Beer, Liquor, and Wine are all present, L/B/W must reconcile
      // against the authoritative Toast Total Net Sales. This prevents one
      // slightly misread alcohol row from producing a partial/wrong LBW total.
      if(totalNetSales!==null&&hasAllAlcoholLabels(source)){
        const nonAlcoholLabels=[
          "Food","Beverages","NA","Gameplay","Retail","Labor",
          "Equipment Rental","Space Rental","Digital Media","Coach",
          "Fees","Other Fees","Voluntary Tip","Service Charge","Admin Fee"
        ];

        const nonAlcoholTotal=nonAlcoholLabels.reduce(
          (sum,label)=>sum+Number(totals[label]||0),
          0
        );

        const reconciledLBW=totalNetSales-nonAlcoholTotal;

        if(Number.isFinite(reconciledLBW)&&reconciledLBW>=-0.005){
          totals.LBW=Math.max(0,reconciledLBW);
          recognized.add("LBW");
        }
      }

      if(totalNetSales===null&&recognized.size){
        const reconstructLabels=[
          "Food","Beverages","LBW","NA","Gameplay","Retail","Labor",
          "Equipment Rental","Space Rental","Digital Media","Coach",
          "Fees","Other Fees","Voluntary Tip","Service Charge","Admin Fee"
        ];

        totalNetSales=reconstructLabels.reduce(
          (sum,label)=>sum+Number(totals[label]||0),
          0
        );
      }

      totals.__recognized=recognized;
      totals.__totalNetSales=totalNetSales;
      return totals;
    }

    function mapToastCategory(row){
      const x=row.toLowerCase().replace(/\s+/g," ").trim();

      if(/\bbeer\b/.test(x)||/\bliquor\b/.test(x)||/\bwine\b/.test(x))return"LBW";
      if(/^n\/?a\s*bev\b|^na\s*bev\b|^non[- ]?alcoholic\b/.test(x))return"NA";
      if(/^food\b/.test(x))return"Food";
      if(/^event\s+drink\s+package\b|^drink\s+package\b|^beverage\s+package\b/.test(x))return"Beverages";
      if(/^game\s*play\b|^gameplay\b/.test(x))return"Gameplay";
      if(/^retail\b/.test(x))return"Retail";
      if(/^event\s*-\s*labou?r\b|^labou?r\b/.test(x))return"Labor";
      if(/^event\s*-\s*equipment\s+rental\b|^equipment\s+rental\b/.test(x))return"Equipment Rental";
      if(/^event\s*-\s*space\s+rental\b|^event\s+space\s+rental\b|^space\s+rental\b/.test(x))return"Space Rental";
      if(/^marketing\s+partnerships?\b|^digital\s+media\b/.test(x))return"Digital Media";
      if(/^admin\s*fee\b/.test(x))return"Admin Fee";
      if(/^service\s+charge\b/.test(x))return"Service Charge";
      if(/^voluntary\s*tip\b|^voluntary\s+gratuity\b|^gratuity\b/.test(x))return"Voluntary Tip";
      if(/^events?\s*-\s*fees?\b|^events?\s+fees?\b|^fees?\b/.test(x))return"Fees";
      if(/^coach\b/.test(x))return"Other Fees";

      return null;
    }

    function extractToastAmounts(row){
      // Every Toast money cell visibly begins with "$". OCR commonly confuses
      // that symbol with "S" or "5" (for example "$68.27" -> "568.27").
      // Treat the FIRST character as the currency marker and never as part of
      // the numeric value.
      const rawTokens=[
        ...String(row||"").matchAll(/(?:^|\s)([$S5])\s*(-?\d[\d,]*\.\d{2})(?=\s|$)/gi)
      ].map(match=>({
        marker:match[1],
        value:parseMoney(match[2])
      })).filter(token=>token.value!==null);

      if(rawTokens.length<3)return[];

      // A Toast category row has Net Sales, Discounts, Gross Sales.
      // Require those three columns to reconcile before accepting the row.
      for(let i=0;i<=rawTokens.length-3;i++){
        const net=rawTokens[i].value;
        const discounts=rawTokens[i+1].value;
        const gross=rawTokens[i+2].value;

        if(
          Number.isFinite(net)&&
          Number.isFinite(discounts)&&
          Number.isFinite(gross)&&
          Math.abs((net+discounts)-gross)<=0.03
        ){
          return[net,discounts,gross];
        }
      }

      // Fail closed: if the Toast row does not mathematically reconcile,
      // do not use any dollar value from it for AR.
      return[];
    }

    function compareAdditionalRevenue(toast,financial,parsed){
      // Compare Toast to the same contracted numbers the user sees in the
      // Contracted boxes. Beverage packages stay separate from day-of L/B/W.
      const contracted={
        Food:Number(financial.categories.Food||0),
        Beverages:Number(financial.categories.Beverages||0),
        LBW:Number(financial.categories.LBW||0),
        NA:Number(financial.categories.NA||0),
        Gameplay:Number(financial.categories.Gameplay||0),
        Retail:Number(financial.categories.Retail||0),
        Labor:Number(financial.categories.Labor||0),
        "Equipment Rental":Number(financial.categories["Equipment Rental"]||0),
        "Space Rental":Number(financial.categories["Space Rental"]||0),
        "Digital Media":Number(financial.categories["Digital Media"]||0),
        Coach:Number(financial.categories.Coach||0),
        "Other Fees":Number(financial.categories["Other Fees"]||0),
        "Voluntary Tip":0,
        "Admin Fee":Number(financial.adminFee||0)
      };

      const items=[];
      const recognized=toast.__recognized instanceof Set?toast.__recognized:new Set();

      // AR treats all beverage-package revenue and day-of Beer/Liquor/Wine
      // as one L/B/W bucket. "Beverages" remains separate only in Contracted.
      if(recognized.has("Beverages")||recognized.has("LBW")){
        const actual=centsMoney(
          moneyCents(toast.Beverages||0)+
          moneyCents(toast.LBW||0)
        );
        const base=centsMoney(
          moneyCents(contracted.Beverages||0)+
          moneyCents(contracted.LBW||0)
        );
        const additional=centsMoney(
          moneyCents(actual)-moneyCents(base)
        );

        if(moneyCents(additional)!==0){
          items.push({
            label:"LBW",
            actual,
            contracted:base,
            additional
          });
        }
      }

      const expectedLabels=[
        "Food","NA","Gameplay","Retail","Labor",
        "Equipment Rental","Space Rental","Digital Media","Coach",
        "Other Fees","Voluntary Tip","Admin Fee"
      ];

      for(const label of expectedLabels){
        if(!recognized.has(label))continue;

        const actual=centsMoney(moneyCents(toast[label]||0));
        const base=centsMoney(moneyCents(contracted[label]||0));
        const additional=centsMoney(
          moneyCents(actual)-moneyCents(base)
        );

        const additionalCents=moneyCents(additional);

        // A +$0.01 Admin Fee difference is treated as Toast/contract rounding,
        // not real additional revenue.
        if(label==="Admin Fee"&&additionalCents===1)continue;

        if(additionalCents!==0){
          items.push({label,actual,contracted:base,additional});
        }
      }

      const isFlex=Array.isArray(parsed&&parsed.tags)&&parsed.tags.includes("Flex");

      if(recognized.has("Fees")){
        const feeAmount=centsMoney(moneyCents(toast.Fees||0));

        if(moneyCents(feeAmount)!==0){
          items.push({
            label:isFlex?"Unused F&B":"Other",
            actual:feeAmount,
            contracted:0,
            additional:feeAmount
          });
        }
      }

      items.sort((a,b)=>b.additional-a.additional);

      const grossTotalCents=items.reduce(
        (sum,item)=>sum+moneyCents(item.additional),
        0
      );
      const fbMinimumCents=isFlex
        ? moneyCents(financial.categories["F&B Minimum"]||0)
        : 0;
      const totalCents=isFlex
        ? grossTotalCents-fbMinimumCents
        : grossTotalCents;
      const grossTotal=centsMoney(grossTotalCents);
      const fbMinimum=centsMoney(fbMinimumCents);
      const total=centsMoney(totalCents);

      const toastTotalNetSales=
        toast.__totalNetSales!==null &&
        toast.__totalNetSales!==undefined &&
        Number.isFinite(Number(toast.__totalNetSales))
          ? Number(toast.__totalNetSales)
          : null;

      const toastAdminFee=Number(toast["Admin Fee"]||0);
      const toastServiceCharge=Number(toast["Service Charge"]||0);

      // Base the check on the category totals actually shown in Contracted,
      // rather than a separately parsed hidden amount.
      const contractedCategorySubtotalCents=[
        "Food","Beverages","NA","F&B Minimum","Gameplay","Retail","Labor",
        "Equipment Rental","Space Rental","Digital Media","Coach","Other Fees"
      ].reduce(
        (sum,label)=>sum+moneyCents(financial.categories[label]||0),
        0
      );

      const contractedSubtotal=
        Number.isFinite(contractedCategorySubtotalCents)
          ? centsMoney(contractedCategorySubtotalCents)
          : (
              financial.subtotal!==null &&
              financial.subtotal!==undefined &&
              Number.isFinite(Number(financial.subtotal))
                ? centsMoney(moneyCents(financial.subtotal))
                : null
            );

      let subtotalCheck=null;

      if(
        toastTotalNetSales!==null &&
        contractedSubtotal!==null
      ){
        // Signed AR is intentional: Toast can be below the contract.
        const toastTotalNetSalesCents=moneyCents(toastTotalNetSales);
        const toastAdminFeeCents=moneyCents(toastAdminFee);
        const toastServiceChargeCents=moneyCents(toastServiceCharge);
        const contractedSubtotalCents=moneyCents(contractedSubtotal);
        const expectedARCents=
          toastTotalNetSalesCents-
          toastAdminFeeCents-
          toastServiceChargeCents-
          contractedSubtotalCents;
        const arDifferenceCents=totalCents-expectedARCents;
        const expectedAR=centsMoney(expectedARCents);
        const arDifference=centsMoney(arDifferenceCents);

        subtotalCheck={
          pass:Math.abs(arDifferenceCents)<=3,
          toastTotalNetSales:centsMoney(toastTotalNetSalesCents),
          toastAdminFee:centsMoney(toastAdminFeeCents),
          toastServiceCharge:centsMoney(toastServiceChargeCents),
          totalAR:total,
          expectedAR,
          contractedSubtotal:centsMoney(contractedSubtotalCents),
          arDifference,
          discrepancy:centsMoney(Math.abs(arDifferenceCents))
        };
      }

      return{
        items,
        grossTotal,
        fbMinimum,
        flexAdjusted:isFlex&&fbMinimum>0.004,
        total,
        subtotalCheck,
        toastServiceCharge,
        recognizedCount:recognized.size
      };
    }

    function renderAdditionalRevenue(container,comparison){

      if(!comparison.items.length){
        const empty=document.createElement("div");

        container.appendChild(empty);

        for(const item of comparison.items){
          const row=document.createElement("div");
          row.className="ar-item "+arClassName(item.label)+(item.additional<0?" negative":"");

          const left=document.createElement("div");

          const label=document.createElement("div");

          detail.className="ar-item-detail";

            item.label==="Play It Forward"
              ? "Contracted "+formatMoney(item.contracted)
              : "Toast "+formatMoney(item.actual)+" · Contracted "+formatMoney(item.contracted);

          const value=document.createElement("div");

          value.textContent=formatSignedMoney(item.additional);

          left.append(label,detail);
          row.append(left,value);

        }

      if(comparison.flexAdjusted){
        const calculation=document.createElement("div");

        const grossLabel=document.createElement("span");

        grossRow.append(grossLabel,grossValue);

        const deductionRow=document.createElement("div");

        deductionRow.append(deductionLabel,deductionValue);

      }

      const total=document.createElement("div");

      const totalLabel=document.createElement("span");
      totalLabel.textContent="Total Additional Revenue";

      const totalValue=document.createElement("strong");
      totalValue.textContent=formatMoney(comparison.total);

      total.append(totalLabel,totalValue);
      container.appendChild(total);
    }

    function getPortfolioSalesTotal(){
      let calculatedCents=0;
      let toastCents=0;
      let canUseToastComparison=currentGroups.length>0;

      for(const group of currentGroups){
        const parsed=group?.parsed;
        if(!parsed)continue;

        const comparison=
          parsed.arProcessed&&parsed.arComparison
            ? parsed.arComparison
            : null;

        const checkedSubtotal=
          comparison?.subtotalCheck?.contractedSubtotal;

        const subtotal=
          checkedSubtotal!==null &&
          checkedSubtotal!==undefined &&
          Number.isFinite(Number(checkedSubtotal))
            ? Number(checkedSubtotal)
            : Number(parsed.financial?.subtotal||0);

        const ar=comparison?Number(comparison.total||0):0;

        // Normal source of truth: exactly what the page is calculating/displaying.
        calculatedCents+=moneyCents(subtotal)+moneyCents(ar);

        if(parsed.tags?.includes("Play It Forward")){
          // Known $0 events do not need a Toast row.
          continue;
        }

        const toast=group.toastData||null;
        const toastNetSales=toast?.__totalNetSales;

        if(
          toastNetSales===null ||
          toastNetSales===undefined ||
          !Number.isFinite(Number(toastNetSales))
        ){
          canUseToastComparison=false;
          continue;
        }

        toastCents+=
          moneyCents(toastNetSales)-
          moneyCents(toast["Admin Fee"]||0)-
          moneyCents(toast["Service Charge"]||0);
      }

      // Only correct a true one-cent rounding discrepancy.
      // Anything larger stays as the page-calculated value so real mismatches
      // remain visible instead of being silently replaced by Toast.
      if(
        canUseToastComparison &&
        Math.abs(calculatedCents-toastCents)===1
      ){
        return centsMoney(toastCents);
      }

      return centsMoney(calculatedCents);
    }

    function getPrimaryEventDateRaw(){
      const dates=currentGroups
        .map(group=>group?.parsed?.date)
        .filter(Boolean);

      if(!dates.length)return null;

      const counts=new Map();
      for(const date of dates){
        counts.set(date,(counts.get(date)||0)+1);
      }

      return [...counts.entries()]
        .sort((a,b)=>b[1]-a[1])[0]?.[0]||null;
    }

    function parseEventDate(raw){
      const match=String(raw||"").match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      if(!match)return null;

      return new Date(
        Number(match[3]),
        Number(match[1])-1,
        Number(match[2]),
        12,0,0
      );
    }

    function getEventCardRange(){
      const cards=currentGroups
        .map(group=>Number(String(group?.parsed?.eventCard||"").trim()))
        .filter(Number.isFinite);

      if(!cards.length)return"";

      const low=Math.min(...cards);
      const high=Math.max(...cards);
      return low===high?String(low):low+"-"+high;
    }

    function getPortfolioSalesDate(){
      const raw=getPrimaryEventDateRaw();
      if(!raw)return"—";

      const date=parseEventDate(raw);
      const range=getEventCardRange();

      if(!date)return raw+(range?" ("+range+")":"");

      const formatted=new Intl.DateTimeFormat("en-US",{
        weekday:"short",
        month:"short",
        day:"numeric",
        year:"numeric"
      }).format(date);

      return formatted+(range?" ("+range+")":"");
    }

    function getExportPdfName(){
      const raw=getPrimaryEventDateRaw();
      const date=parseEventDate(raw);

      if(!date)return"AR.pdf";

      const weekday=new Intl.DateTimeFormat("en-US",{weekday:"short"}).format(date);
      const mm=String(date.getMonth()+1).padStart(2,"0");
      const dd=String(date.getDate()).padStart(2,"0");
      const yy=String(date.getFullYear()).slice(-2);

      return weekday+" "+mm+"."+dd+"."+yy+" AR.pdf";
    }

    function animatePortfolioSales(target){
      const end=Number.isFinite(target)?target:0;

      if(portfolioSalesAnimation){
        cancelAnimationFrame(portfolioSalesAnimation);
        portfolioSalesAnimation=null;
      }

      if(reduced){
        portfolioSalesDisplay=end;
        portfolioSalesValue.textContent=formatMoney(end);
        return;
      }

      const startValue=portfolioSalesDisplay;
      const delta=end-startValue;

      if(Math.abs(delta)<0.005){
        portfolioSalesDisplay=end;
        portfolioSalesValue.textContent=formatMoney(end);
        return;
      }

      const started=performance.now();
      const duration=Math.min(
        1350,
        Math.max(650,700+Math.log10(Math.abs(delta)+1)*130)
      );

      const tick=(now)=>{
        const progress=Math.min(1,(now-started)/duration);
        const eased=1-Math.pow(1-progress,4);
        portfolioSalesDisplay=startValue+(delta*eased);
        portfolioSalesValue.textContent=formatMoney(portfolioSalesDisplay);

        if(progress<1){
          portfolioSalesAnimation=requestAnimationFrame(tick);
        }else{
          portfolioSalesDisplay=end;
          portfolioSalesValue.textContent=formatMoney(end);
          portfolioSalesAnimation=null;
        }
      };

      portfolioSalesAnimation=requestAnimationFrame(tick);
    }

    function getToastReportUrl(){
      const raw=getPrimaryEventDateRaw();
      const date=parseEventDate(raw);
      if(!date)return null;

      const yyyy=String(date.getFullYear());
      const mm=String(date.getMonth()+1).padStart(2,"0");
      const dd=String(date.getDate()).padStart(2,"0");
      const reportDate=yyyy+mm+dd;

      return "https://www.toasttab.com/restaurants/admin/reports/sales/sales-summary"+
        "?diningOptions=Events%2CFlex+Event"+
        "&startDate="+reportDate+
        "&endDate="+reportDate+
        "&locations=FvXo0LDEQMCc%2BUtBtxDWLQ%3D%3D";
    }

    function updatePortfolioSales(){
      portfolioSalesDate.textContent=getPortfolioSalesDate();

      const toastReportUrl=getToastReportUrl();
      if(toastReportUrl){
        portfolioSalesLink.href=toastReportUrl;
        portfolioSalesLink.setAttribute("aria-label","Click to copy total sales. Double-click to open Toast report for "+getPortfolioSalesDate()+".");
      }else{
        portfolioSalesLink.href="#";
        portfolioSalesLink.setAttribute("aria-label","Toast report unavailable");
      }

      animatePortfolioSales(getPortfolioSalesTotal());
    }

    async function getPdfPageTextItems(pdf,pageNumber){
      if(!pdf)return[];
      const page=await pdf.getPage(pageNumber);
      const content=await page.getTextContent();

      return content.items
        .filter(item=>item.str&&item.str.trim())
        .map(item=>({
          text:clean(item.str),
          x:(item.transform&&item.transform[4])||0,
          y:(item.transform&&item.transform[5])||0,
          width:item.width||0
        }));
